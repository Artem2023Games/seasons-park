<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Seasons Park — Мультиплеер игра</title>
<script src="progress.js"></script>
<script src="characters.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --bg:#050810;
    --office:#0d1420;
    --wall:#1a2332;
    --accent:#38bdf8;
    --accent2:#a78bfa;
    --danger:#ef4444;
    --success:#4ade80;
    --gold:#fbbf24;
    --star:#f472b6;
    --text:#e2e8f0;
    --muted:#64748b;
    --border:#1e293b;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{height:100%;overflow:hidden;}
  body{
    font-family:system-ui,Segoe UI,Roboto,sans-serif;
    background:var(--bg);color:var(--text);
    user-select:none;-webkit-tap-highlight-color:transparent;
  }

  #office{
    position:relative;
    width:100vw;height:100vh;
    background:radial-gradient(ellipse at 50% 100%, #0d1420 0%, #050810 70%);
    overflow:hidden;
    transition:opacity .3s;
  }
  #office.hidden{opacity:0;pointer-events:none;}

  body[data-season="summer"] #office{background:radial-gradient(ellipse at 50% 100%, #1e1b0f 0%, #050810 70%);}
  body[data-season="autumn"] #office{background:radial-gradient(ellipse at 50% 100%, #1f1205 0%, #050810 70%);}
  body[data-season="winter"] #office{background:radial-gradient(ellipse at 50% 100%, #0a1a2e 0%, #050810 70%);}
  body[data-season="spring"] #office{background:radial-gradient(ellipse at 50% 100%, #1f0e1a 0%, #050810 70%);}

  #office::after{
    content:'';position:absolute;inset:0;pointer-events:none;
    background:radial-gradient(ellipse at center, transparent 30%, rgba(0,0,0,.85) 100%);
    z-index:5;
  }

  .wall{position:absolute;background:linear-gradient(180deg, var(--wall), var(--office));z-index:1;}
  .wall-left{left:0;top:0;width:25%;height:100%;border-right:2px solid #000;}
  .wall-right{right:0;top:0;width:25%;height:100%;border-left:2px solid #000;}
  .wall-back{left:25%;top:0;width:50%;height:65%;background:linear-gradient(180deg,#1a2332,#0d1420);border-bottom:2px solid #000;}

  .poster{position:absolute;top:15%;left:10%;width:120px;height:150px;background:linear-gradient(135deg,#1e293b,#0f172a);border:3px solid #334155;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:2rem;transform:rotate(-3deg);box-shadow:0 5px 20px rgba(0,0,0,.6);opacity:.7;}
  .poster-text{position:absolute;bottom:8px;width:100%;text-align:center;font-size:.6rem;color:#475569;letter-spacing:2px;}

  #clock{position:absolute;top:20px;left:50%;transform:translateX(-50%);font-size:3rem;font-weight:700;color:var(--accent);text-shadow:0 0 20px rgba(56,189,248,.5);z-index:6;font-variant-numeric:tabular-nums;letter-spacing:2px;}
  #night-label{position:absolute;top:80px;left:50%;transform:translateX(-50%);font-size:.9rem;color:var(--muted);letter-spacing:3px;z-index:6;text-transform:uppercase;text-align:center;}

  #energy-wrap{position:absolute;bottom:20px;left:20px;z-index:6;width:220px;display:flex;flex-direction:column;gap:6px;}
  #energy-label{font-size:.75rem;color:var(--muted);letter-spacing:2px;text-transform:uppercase;display:flex;align-items:center;gap:6px;}
  #energy-bar{width:100%;height:16px;background:#0a0f18;border:2px solid var(--border);border-radius:8px;overflow:hidden;}
  #energy-fill{height:100%;width:100%;background:linear-gradient(90deg,var(--success),#22c55e);transition:width .15s, background .3s;border-radius:6px;}
  #energy-fill.warn{background:linear-gradient(90deg,var(--gold),#f59e0b);}
  #energy-fill.critical{background:linear-gradient(90deg,var(--danger),#dc2626);animation:flash .5s infinite;}
  @keyframes flash{50%{opacity:.5;}}
  #energy-text{font-size:.85rem;color:var(--text);font-variant-numeric:tabular-nums;text-align:right;}

  .door{position:absolute;top:0;height:100%;width:25%;background:linear-gradient(180deg,#000,#0a0f18);border:3px solid #1e293b;transition:transform .3s ease;z-index:3;}
  .door.left{left:0;transform:translateX(-100%);}
  .door.right{right:0;transform:translateX(100%);}
  .door.closed{transform:translateX(0);}
  .door::before{content:'';position:absolute;inset:15%;border:2px solid #0f172a;border-radius:4px;}
  .door::after{content:'';position:absolute;bottom:40%;right:20px;width:8px;height:30px;background:#334155;border-radius:2px;}
  .door.right::after{right:auto;left:20px;}

  .door-glow{position:absolute;top:0;height:100%;width:25%;background:radial-gradient(circle at center, rgba(251,191,36,.15), transparent 70%);z-index:2;pointer-events:none;opacity:0;transition:opacity .3s;}
  .door-glow.left{left:0;}
  .door-glow.right{right:0;}
  .door-glow.on{opacity:1;}

  .door-char{
    position:absolute;top:30%;font-size:5rem;z-index:4;pointer-events:none;
    filter:drop-shadow(0 0 20px currentColor);
    animation:doorCharPulse 1s infinite;
  }
  .door-char.left{left:8%;}
  .door-char.right{right:8%;}
  @keyframes doorCharPulse{
    0%,100%{transform:scale(1);opacity:.7;}
    50%{transform:scale(1.1);opacity:1;}
  }

  .ceiling-char{
    position:absolute;top:5%;left:50%;transform:translateX(-50%);
    font-size:4rem;z-index:4;pointer-events:none;
    filter:drop-shadow(0 0 20px currentColor);
    animation:ceilingFloat 2s ease-in-out infinite;
    opacity:0;transition:opacity .3s;
  }
  .ceiling-char.on{opacity:1;}
  @keyframes ceilingFloat{
    0%,100%{transform:translateX(-50%) translateY(0);}
    50%{transform:translateX(-50%) translateY(10px);}
  }

  .door-btn,.door-light-btn{
    position:absolute;border-radius:50%;border:3px solid var(--border);
    background:#0a0f18;color:var(--muted);cursor:pointer;
    transition:all .2s;z-index:4;
    display:flex;align-items:center;justify-content:center;
  }
  .door-btn{width:60px;height:60px;font-size:1.5rem;bottom:40px;}
  .door-light-btn{width:50px;height:50px;font-size:1.3rem;bottom:110px;}
  .door-btn:hover,.door-light-btn:hover{transform:scale(1.1);}
  .door-btn.active{background:var(--danger);border-color:var(--danger);color:#fff;box-shadow:0 0 20px var(--danger);}
  .door-light-btn.on{background:var(--gold);border-color:var(--gold);color:#000;box-shadow:0 0 30px var(--gold);}
  .door-btn.left-btn{left:calc(25% - 80px);}
  .door-btn.right-btn{right:calc(25% - 80px);}
  .door-light-btn.left-btn{left:calc(25% - 80px);}
  .door-light-btn.right-btn{right:calc(25% - 80px);}

  #bottomPanel{position:absolute;bottom:20px;left:50%;transform:translateX(-50%);z-index:6;display:flex;gap:10px;}
  .panel-btn{
    padding:12px 20px;background:linear-gradient(90deg,var(--accent),var(--accent2));
    border:none;border-radius:10px;color:#0f172a;font-weight:700;font-size:.9rem;
    cursor:pointer;transition:transform .15s;box-shadow:0 5px 20px rgba(56,189,248,.3);
    display:flex;align-items:center;gap:8px;
  }
  .panel-btn:hover{transform:translateY(-2px);}
  .panel-btn.secondary{background:#1e293b;color:var(--text);border:2px solid var(--border);box-shadow:none;}
  .panel-btn.secondary:hover{border-color:var(--accent);color:var(--accent);}
  .panel-btn .key-hint{font-size:.7rem;opacity:.6;font-family:monospace;}

  /* ПАНЕЛЬ ИГРОКОВ */
  #playersPanel{
    position:fixed;top:20px;right:20px;z-index:20;
    background:rgba(10,15,24,.95);
    border:2px solid var(--border);border-radius:14px;
    padding:14px;min-width:200px;max-width:240px;
    box-shadow:0 5px 30px rgba(0,0,0,.6);
  }
  #playersPanel h3{
    color:var(--accent);font-size:.75rem;
    letter-spacing:2px;text-transform:uppercase;
    margin-bottom:10px;display:flex;justify-content:space-between;align-items:center;
  }
  #playersPanel h3 .count{color:var(--muted);font-size:.7rem;}
  .mp-player{
    display:flex;align-items:center;gap:8px;
    padding:8px 10px;background:var(--office);
    border-radius:8px;margin-bottom:6px;font-size:.85rem;
    transition:all .3s;
  }
  .mp-player.dead{opacity:.4;text-decoration:line-through;}
  .mp-player.me{border:1px solid var(--accent);background:rgba(56,189,248,.1);}
  .mp-player .mp-avatar{
    width:26px;height:26px;border-radius:50%;
    background:linear-gradient(135deg,var(--accent),var(--accent2));
    display:flex;align-items:center;justify-content:center;
    font-size:.8rem;font-weight:900;color:#0f172a;flex-shrink:0;
  }
  .mp-player .mp-name{
    flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600;
  }
  .mp-player .mp-status{font-size:.9rem;flex-shrink:0;}
  #survivorsCount{
    text-align:center;padding:8px;background:rgba(30,41,59,.6);
    border-radius:8px;font-size:.8rem;color:var(--muted);margin-top:8px;
  }
  #survivorsCount b{color:var(--success);font-size:1rem;}

  /* КАМЕРЫ */
  #camerasOverlay{
    position:fixed;inset:0;background:#000;
    z-index:50;display:none;grid-template-columns:200px 1fr;
  }
  #camerasOverlay.show{display:grid;}
  #camList{
    background:#0a0f18;border-right:2px solid var(--border);
    overflow-y:auto;padding:10px;display:flex;flex-direction:column;gap:6px;
  }
  #camList::-webkit-scrollbar{width:6px;}
  #camList::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px;}
  .cam-title{
    color:var(--accent);font-size:.7rem;letter-spacing:3px;
    text-transform:uppercase;margin-bottom:8px;padding:0 6px;font-weight:700;
  }
  .cam-item{
    padding:10px 12px;background:#0d1420;border:1px solid var(--border);
    border-radius:8px;cursor:pointer;transition:all .2s;
    font-size:.85rem;display:flex;align-items:center;gap:10px;
  }
  .cam-item:hover{border-color:var(--accent);transform:translateX(3px);}
  .cam-item.active{
    background:linear-gradient(90deg,var(--accent),var(--accent2));
    color:#0f172a;font-weight:700;border-color:transparent;
  }
  .cam-item .num{font-family:monospace;font-size:.75rem;opacity:.7;min-width:20px;}
  .cam-item .emoji{font-size:1.2rem;}
  .cam-item .name{flex:1;}
  #camView{position:relative;overflow:hidden;background:#000;}
  #camView::before{
    content:'';position:absolute;inset:0;pointer-events:none;z-index:10;
    background:repeating-linear-gradient(0deg, rgba(0,0,0,.15) 0px, rgba(0,0,0,.15) 1px, transparent 1px, transparent 3px);
  }
  #camView::after{
    content:'';position:absolute;inset:0;pointer-events:none;z-index:11;
    background:radial-gradient(ellipse at center, transparent 40%, rgba(0,0,0,.75) 100%);
  }
  #camNoise{
    position:absolute;inset:0;pointer-events:none;z-index:9;opacity:.07;
    background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
    animation:noiseMove .1s infinite;
  }
  @keyframes noiseMove{0%{transform:translate(0,0);}100%{transform:translate(-5%,-5%);}}
  #camLabel{
    position:absolute;top:20px;left:20px;z-index:12;
    background:rgba(0,0,0,.75);border:1px solid var(--accent);
    border-radius:8px;padding:8px 16px;
    font-size:.95rem;font-weight:700;color:var(--accent);
    letter-spacing:2px;text-transform:uppercase;
    display:flex;align-items:center;gap:10px;
  }
  #camLabel .rec{
    display:inline-block;width:10px;height:10px;
    background:var(--danger);border-radius:50%;animation:rec 1.5s infinite;
  }
  @keyframes rec{0%,100%{opacity:1;box-shadow:0 0 8px var(--danger);}50%{opacity:.2;box-shadow:none;}}
  #camClock{
    position:absolute;top:20px;right:20px;z-index:12;
    background:rgba(0,0,0,.75);border:1px solid var(--border);
    border-radius:8px;padding:8px 16px;
    font-size:1.1rem;font-weight:700;color:var(--accent);
    letter-spacing:2px;font-variant-numeric:tabular-nums;
  }
  #camClock .night-info{
    display:block;font-size:.65rem;color:var(--muted);
    letter-spacing:1px;text-align:center;margin-top:2px;
    font-weight:400;text-transform:uppercase;
  }
  #camControls{
    position:absolute;bottom:20px;left:20px;right:20px;
    z-index:12;display:flex;justify-content:space-between;align-items:center;gap:10px;
  }
  #backBtn{
    padding:12px 24px;background:var(--danger);border:none;border-radius:10px;
    color:#fff;font-weight:700;font-size:.95rem;cursor:pointer;
    transition:transform .15s;display:flex;align-items:center;gap:8px;
  }
  #backBtn:hover{transform:translateY(-2px);}
  .nav-buttons{display:flex;gap:8px;}
  .nav-btn{
    width:50px;height:50px;background:rgba(30,41,59,.9);
    border:2px solid var(--border);border-radius:10px;
    color:var(--text);font-size:1.2rem;cursor:pointer;
    transition:all .2s;display:flex;align-items:center;justify-content:center;
  }
  .nav-btn:hover{border-color:var(--accent);color:var(--accent);background:rgba(56,189,248,.15);}
  #camScene{position:absolute;inset:0;z-index:1;}
  .cam-char{
    position:absolute;font-size:7rem;z-index:5;
    filter:drop-shadow(0 0 25px currentColor);
    animation:charAppear .5s ease;pointer-events:none;
    top:50%;left:50%;
  }
  @keyframes charAppear{
    from{opacity:0;transform:scale(.8) translate(-50%,-50%);}
    to{opacity:1;transform:scale(1) translate(-50%,-50%);}
  }

  /* Сцены */
  .scene-sky{position:absolute;inset:0;background:linear-gradient(180deg, #050810 0%, #0a0f18 50%, #0d1420 100%);}
  .scene-floor{position:absolute;bottom:0;left:0;right:0;height:45%;background:linear-gradient(180deg, transparent, #0a0f18);}
  .scene-moon{
    position:absolute;top:15%;right:15%;
    width:80px;height:80px;
    background:radial-gradient(circle, #fef3c7 0%, #fbbf24 60%, transparent 70%);
    border-radius:50%;opacity:.4;box-shadow:0 0 60px rgba(251,191,36,.3);
  }
  .scene-stars{position:absolute;inset:0;pointer-events:none;}
  .scene-star{
    position:absolute;width:2px;height:2px;
    background:#fff;border-radius:50%;opacity:.3;
    animation:twinkle 3s infinite;
  }
  @keyframes twinkle{50%{opacity:1;}}
  .carousel{position:absolute;bottom:25%;left:50%;transform:translateX(-50%);width:300px;height:200px;}
  .carousel .wheel{
    position:absolute;bottom:40px;left:50%;transform:translateX(-50%);
    width:220px;height:140px;border:4px solid #334155;
    border-radius:50% 50% 0 0;border-bottom:none;
    animation:carouselSpin 8s linear infinite;
  }
  @keyframes carouselSpin{
    0%{transform:translateX(-50%) rotate(-3deg);}
    50%{transform:translateX(-50%) rotate(3deg);}
    100%{transform:translateX(-50%) rotate(-3deg);}
  }
  .carousel .bulb{
    position:absolute;width:8px;height:8px;
    border-radius:50%;background:var(--gold);
    box-shadow:0 0 10px var(--gold);animation:bulbBlink 1.5s infinite;
  }
  @keyframes bulbBlink{50%{opacity:.3;}}
  .carousel .base{
    position:absolute;bottom:0;left:50%;transform:translateX(-50%);
    width:240px;height:40px;background:linear-gradient(180deg,#1e293b,#0d1420);
    border-radius:6px;border:2px solid #334155;
  }
  .carousel .pole{
    position:absolute;bottom:40px;left:50%;transform:translateX(-50%);
    width:6px;height:100px;background:#334155;
  }
  .fountain{position:absolute;bottom:20%;left:50%;transform:translateX(-50%);width:280px;height:220px;}
  .fountain .basin{
    position:absolute;bottom:0;left:50%;transform:translateX(-50%);
    width:260px;height:60px;background:linear-gradient(180deg,#1e293b,#0a0f18);
    border:3px solid #334155;border-radius:0 0 50% 50% / 0 0 100% 100%;
  }
  .fountain .water{
    position:absolute;bottom:60px;left:50%;transform:translateX(-50%);
    width:200px;height:8px;background:linear-gradient(90deg,transparent,#38bdf8,transparent);
    border-radius:50%;animation:waterFlow 2s ease-in-out infinite;
  }
  @keyframes waterFlow{
    0%,100%{width:180px;opacity:.6;}
    50%{width:220px;opacity:1;}
  }
  .fountain .jet{
    position:absolute;bottom:60px;left:50%;transform:translateX(-50%);
    width:4px;background:linear-gradient(0deg,#38bdf8,transparent);
    border-radius:2px;animation:jetUp 2s infinite;
  }
  @keyframes jetUp{
    0%{height:0;opacity:0;}
    20%{height:100px;opacity:1;}
    100%{height:140px;opacity:0;}
  }
  .tree{position:absolute;bottom:20%;left:50%;transform:translateX(-50%);width:200px;height:280px;}
  .tree .trunk{
    position:absolute;bottom:0;left:50%;transform:translateX(-50%);
    width:30px;height:100px;background:linear-gradient(90deg,#1e293b,#334155,#1e293b);
  }
  .tree .crown{
    position:absolute;bottom:80px;left:50%;transform:translateX(-50%);
    width:180px;height:160px;background:radial-gradient(circle,#4ade80 0%, #16a34a 50%, transparent 70%);
    border-radius:50%;opacity:.5;animation:treeSway 4s ease-in-out infinite;
  }
  @keyframes treeSway{
    0%,100%{transform:translateX(-50%) rotate(-2deg);}
    50%{transform:translateX(-50%) rotate(2deg);}
  }
  .tree .leaf{position:absolute;font-size:1.2rem;animation:leafFall 5s linear infinite;}
  @keyframes leafFall{
    0%{transform:translateY(-50px) rotate(0deg);opacity:1;}
    100%{transform:translateY(150px) rotate(360deg);opacity:0;}
  }
  .slide{position:absolute;bottom:15%;left:50%;transform:translateX(-50%);width:340px;height:280px;}
  .slide .ramp{
    position:absolute;bottom:0;width:100%;height:100%;
    background:linear-gradient(135deg, transparent 40%, #38bdf8 50%, #0ea5e9 60%, transparent 100%);
    opacity:.4;clip-path:polygon(0% 100%, 50% 20%, 100% 100%);
  }
  .slide .snow{
    position:absolute;bottom:0;left:0;right:0;height:60px;
    background:linear-gradient(180deg, #e0f2fe, #bae6fd);
    opacity:.3;border-radius:50% 50% 0 0;
  }
  .slide .flake{position:absolute;color:#e0f2fe;font-size:.9rem;animation:snowFall 4s linear infinite;opacity:.7;}
  @keyframes snowFall{
    0%{transform:translateY(-30px) rotate(0deg);opacity:0;}
    20%{opacity:.7;}
    100%{transform:translateY(200px) rotate(180deg);opacity:0;}
  }
  .rink{position:absolute;bottom:20%;left:50%;transform:translateX(-50%);width:380px;height:180px;}
  .rink .ice{
    position:absolute;bottom:0;left:0;right:0;height:120px;
    background:linear-gradient(180deg, rgba(56,189,248,.2), rgba(56,189,248,.4));
    border:2px solid rgba(56,189,248,.5);border-radius:50% / 30%;
    animation:iceShimmer 3s ease-in-out infinite;
  }
  @keyframes iceShimmer{
    0%,100%{opacity:.6;}
    50%{opacity:.9;}
  }
  .flowerbed{
    position:absolute;bottom:20%;left:50%;transform:translateX(-50%);
    width:380px;height:180px;display:flex;flex-wrap:wrap;
    justify-content:center;align-items:flex-end;gap:14px;padding:0 20px;
  }
  .flower{
    font-size:1.6rem;animation:flowerSway 3s ease-in-out infinite;
    filter:drop-shadow(0 0 8px rgba(244,114,182,.4));
  }
  .flower:nth-child(2n){animation-delay:.5s;}
  .flower:nth-child(3n){animation-delay:1s;}
  @keyframes flowerSway{
    0%,100%{transform:rotate(-5deg);}
    50%{transform:rotate(5deg);}
  }
  .maze{position:absolute;inset:10%;border:2px solid rgba(167,139,250,.3);border-radius:8px;}
  .maze::before, .maze::after{content:'';position:absolute;background:rgba(167,139,250,.2);}
  .maze::before{top:20%;left:0;right:0;height:2px;}
  .maze::after{top:60%;left:0;right:0;height:2px;}
  .maze .wall{position:absolute;background:rgba(167,139,250,.25);}
  .alley{position:absolute;inset:0;}
  .alley .path{
    position:absolute;bottom:0;left:50%;transform:translateX(-50%);
    width:200px;height:100%;background:linear-gradient(180deg, transparent, rgba(100,116,139,.15));
    clip-path:polygon(35% 0%, 65% 0%, 100% 100%, 0% 100%);
  }
  .alley .lamp{position:absolute;bottom:40%;width:4px;height:80px;background:#334155;}
  .alley .lamp::after{
    content:'';position:absolute;top:-10px;left:50%;transform:translateX(-50%);
    width:24px;height:14px;background:radial-gradient(circle, var(--gold), transparent);
    border-radius:50%;box-shadow:0 0 30px var(--gold);
    animation:lampFlicker 4s infinite;
  }
  @keyframes lampFlicker{
    0%,100%{opacity:.9;}
    45%{opacity:.3;}
    47%{opacity:.9;}
    48%{opacity:.2;}
    50%{opacity:.9;}
  }
  .tunnel{position:absolute;inset:0;background:radial-gradient(ellipse at center, #0a0f18 0%, #000 80%);}
  .tunnel::before{
    content:'';position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);

  .stage-spotlight.left{left:22%;}

  }
  .stage-sign{position:absolute;top:15%;left:50%;transform:translateX(-50%);padding:8px 24px;background:rgba(0,0,0,.75);border:2px solid var(--gold);border-radius:8px;color:var(--gold);font-weight:900;letter-spacing:3px;font-size:.85rem;z-index:3;text-transform:uppercase;}

  /* ДЖАМПСКЕЙР */
  #jumpScare{
    position:fixed;inset:0;z-index:500;background:#000;

  @keyframes scareGrow{from{transform:scale(.3);opacity:0;}to{transform:scale(1);opacity:1;}}
  #jumpScare .scare-text{position:absolute;bottom:10%;color:#fff;font-size:1.5rem;letter-spacing:5px;text-transform:uppercase;font-weight:900;z-index:3;text-shadow:0 0 20px var(--danger);animation:pulse 1s infinite;}
  @keyframes pulse{0%,100%{opacity:1;}50%{opacity:.5;}}

  /* ЭКРАН КОНЦА */

  .chat-header .chat-toggle{

    #chatWidget{width:calc(100vw - 40px);}

  }
</style>

<script>
// ============================================================
// game-mp.html — Мультиплеерная игра с чатом
// ============================================================

const SUPABASE_URL = 'https://zzipvumlgsqxbwqkmfdp.supabase.co';
const SUPABASE_KEY = 'sb_publishable_0g5nyxbu-D6gN30e4Dxu2w_nL_n_Z8_';

const CONFIG = {
  HOUR_DURATION: 89,
  TOTAL_HOURS: 6,
  ENERGY_MAX: 100,
  BASE_DRAIN_PER_SEC: 1 / 9.6,
  DRAIN_MULTIPLIERS: { 1:1, 2:2, 3:3, 4:4 },
};

const NIGHT_SEASONS = { 1:'summer', 2:'autumn', 3:'winter', 4:'spring', 5:'broken', 6:'secret' };
const SEASONS = {
  summer:{name:'Лето',emoji:'☀️'}, autumn:{name:'Осень',emoji:'🍁'},
  winter:{name:'Зима',emoji:'❄️'}, spring:{name:'Весна',emoji:'🌸'},
};

const CAMERAS = [
  { id:'main-stage', num:1, name:'Главная сцена', emoji:'🎭' },
  { id:'carousel',  num:2, name:'Карусель',      emoji:'🎠' },
  { id:'fountain',  num:3, name:'Фонтан',        emoji:'⛲' },
  { id:'tree',      num:4, name:'Старое дерево', emoji:'🌳' },
  { id:'slide',     num:5, name:'Ледяная горка', emoji:'🎢' },
  { id:'rink',      num:6, name:'Каток',         emoji:'⛸️' },
  { id:'flowerbed', num:7, name:'Клумба',        emoji:'🌸' },
  { id:'maze',      num:8, name:'Лабиринт',      emoji:'🌿' },
  { id:'alley',     num:9, name:'Главная аллея', emoji:'🛤️' },
  { id:'tunnel',    num:0, name:'Тоннель',       emoji:'🚇' },
  { id:'roof',      num:-1, name:'Крыша',        emoji:'🏠' },
];

const $ = id => document.getElementById(id);

const params = new URLSearchParams(location.search);
const LOBBY_ID = params.get('lobby');
const PLAYER_ID = params.get('player');

if (!LOBBY_ID || !PLAYER_ID){
  location.href = 'multiplayer.html';
}

const game = {
  running: false,
  hour: 0,
  timeInHour: 0,
  energy: 100,
  night: 1,
  season: 'summer',
  leftDoor: false,
  rightDoor: false,
  leftLight: false,
  rightLight: false,
  camerasOpen: false,
  currentCam: 'main-stage',
  dead: false,
  mode: 'lms',
  lobbyName: 'Комната',
  playerName: 'Игрок',
  players: [],
  supabase: null,
  channels: [],
  lastSync: 0,
  chatOpen: false,
  unreadMessages: 0,
  knownMessages: new Set(),
  previousAliveIds: [],
};

// ===== Supabase =====
function initSupabase(){
  try{
    game.supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    return true;
  }catch(e){
    console.error('Supabase error:', e);
    return false;
  }
}

// ===== Утилиты =====
function formatTime(hour, secInHour = 0){
  const h = hour === 0 ? 12 : hour;
  const m = Math.floor((secInHour / CONFIG.HOUR_DURATION) * 60);
  return String(h).padStart(2,'0') + ':' + String(m).padStart(2,'0');
}

function showToast(text, type = ''){
  const t = $('toast');
  t.textContent = text;
  t.className = 'show ' + type;
  clearTimeout(t._t);
  t._t = setTimeout(() => { t.className = type; }, 2500);
}

function getUsageLevel(){
  let level = 1;
  if (game.leftDoor) level++;
  if (game.rightDoor) level++;
  if (game.leftLight) level++;
  if (game.rightLight) level++;
  if (game.camerasOpen) level++;
  return Math.min(level, 4);
}

function getDrainPerSec(){
  const usage = getUsageLevel();
  return CONFIG.BASE_DRAIN_PER_SEC * (CONFIG.DRAIN_MULTIPLIERS[usage] || 1);
}

function escapeHtml(text){
  const div = document.createElement('div');
  div.textContent = text;
  return div.innerHTML;
}

// ===== Загрузка лобби =====
async function loadLobby(){
  try{
    const { data: lobby, error: lobbyError } = await game.supabase
      .from('lobbies').select('*').eq('id', LOBBY_ID).maybeSingle();
    if (lobbyError) throw lobbyError;
    if (!lobby){ showToast('Лобби не найдено', 'danger'); return; }

    game.mode = lobby.mode || 'lms';
    game.lobbyName = lobby.name || 'Комната';

    $('night-label').textContent = `${game.lobbyName} · ${game.mode === 'coop' ? '🤝 Кооператив' : '🏆 LMS'}`;

    const { data: me, error: meError } = await game.supabase
      .from('players').select('*').eq('id', PLAYER_ID).maybeSingle();
    if (meError) throw meError;
    if (!me){ showToast('Вы не в лобби', 'danger'); location.href = 'multiplayer.html'; return; }

    game.playerName = me.name;

    await loadPlayers();
    subscribeToPlayers();
    subscribeToLobby();
    subscribeToChat();
    loadMessages();

    startGame();
  }catch(e){
    console.error('Ошибка:', e);
    showToast('Ошибка загрузки', 'danger');
  }
}

async function loadPlayers(){
  try{
    const { data, error } = await game.supabase
      .from('players').select('*').eq('lobby_id', LOBBY_ID)
      .order('created_at', { ascending: true });
    if (error) throw error;

    const newPlayers = data || [];
    
    // Проверяем смерти
    const newAliveIds = newPlayers.filter(p => p.status === 'alive').map(p => p.id);
    if (game.previousAliveIds.length > 0){
      game.previousAliveIds.forEach(id => {
        if (!newAliveIds.includes(id)){
          const deadPlayer = newPlayers.find(p => p.id === id);
          if (deadPlayer && deadPlayer.id !== PLAYER_ID){
            addSystemMessage(`💀 ${deadPlayer.name} погиб`);
          }
        }
      });
    }
    game.previousAliveIds = newAliveIds;

    game.players = newPlayers;
    updatePlayersUI();
  }catch(e){
    console.error('Ошибка:', e);
  }
}

function updatePlayersUI(){
  const players = game.players;
  const alive = players.filter(p => p.status === 'alive').length;
  
  $('survivorsCountText').textContent = `${alive}/${players.length}`;
  $('aliveCount').textContent = alive;

  const html = players.map(p => {
    const isMe = p.id === PLAYER_ID;
    const isDead = p.status === 'dead';
    const initial = p.name.charAt(0).toUpperCase();
    const statusEmoji = isDead ? '💀' : '✅';
    
    return `
      <div class="mp-player ${isDead ? 'dead' : ''} ${isMe ? 'me' : ''}">
        <div class="mp-avatar">${initial}</div>
        <div class="mp-name">${p.name}${isMe ? ' (вы)' : ''}</div>
        <div class="mp-status">${statusEmoji}</div>
      </div>
    `;
  }).join('');

  $('playersList').innerHTML = html;
}

function subscribeToPlayers(){
  const channel = game.supabase
    .channel('game-players-' + LOBBY_ID)
    .on('postgres_changes', {
      event: '*', schema: 'public', table: 'players',
      filter: `lobby_id=eq.${LOBBY_ID}`
    }, payload => {
      if (payload.eventType === 'DELETE' && payload.old.id === PLAYER_ID){
        showToast('💥 Вас выгнали', 'danger');
        setTimeout(() => location.href = 'multiplayer.html', 2000);
        return;
      }
      loadPlayers();
    })
    .subscribe();
  game.channels.push(channel);
}

function subscribeToLobby(){
  const channel = game.supabase
    .channel('game-lobby-' + LOBBY_ID)
    .on('postgres_changes', {
      event: 'DELETE', schema: 'public', table: 'lobbies',
      filter: `id=eq.${LOBBY_ID}`
    }, () => {
      showToast('💥 Хост распустил комнату', 'danger');
      setTimeout(() => location.href = 'multiplayer.html', 2000);
    })
    .subscribe();
  game.channels.push(channel);
}

// ===== ЧАТ =====
function subscribeToChat(){
  const channel = game.supabase
    .channel('game-chat-' + LOBBY_ID)
    .on('postgres_changes', {
      event: 'INSERT', schema: 'public', table: 'messages',
      filter: `lobby_id=eq.${LOBBY_ID}`
    }, payload => {
      addMessageToChat(payload.new, true);
    })
    .subscribe();
  game.channels.push(channel);
}

async function loadMessages(){
  try{
    const { data, error } = await game.supabase
      .from('messages').select('*').eq('lobby_id', LOBBY_ID)
      .order('created_at', { ascending: true }).limit(100);
    if (error) throw error;
    
    $('chatMessages').innerHTML = '';
    game.knownMessages.clear();
    (data || []).forEach(msg => {
      game.knownMessages.add(msg.id);
      addMessageToChat(msg, false);
    });
  }catch(e){
    console.error('Ошибка загрузки чата:', e);
  }
}

async function sendChatMessage(){
  const input = $('chatInput');
  const text = input.value.trim();
  if (!text) return;
  if (!LOBBY_ID || !PLAYER_ID) return;

  input.value = '';

  try{
    await game.supabase.from('messages').insert({
      lobby_id: LOBBY_ID,
      player_id: PLAYER_ID,
      player_name: game.playerName,
      text: text,
      type: 'chat'
    });
  }catch(e){
    console.error('Ошибка отправки:', e);
    showToast('Не удалось отправить', 'danger');
  }
}

async function addSystemMessage(text){
  if (!LOBBY_ID || !PLAYER_ID) return;
  try{
    await game.supabase.from('messages').insert({
      lobby_id: LOBBY_ID,
      player_id: PLAYER_ID,
      player_name: 'System',
      text: text,
      type: 'system'
    });
  }catch(e){}
}

function addMessageToChat(msg, isNew){
  if (game.knownMessages.has(msg.id)) return;
  game.knownMessages.add(msg.id);

  const container = $('chatMessages');
  const isMe = msg.player_id === PLAYER_ID;
  const isSystem = msg.type === 'system' || msg.player_name === 'System';
  
  const div = document.createElement('div');
  div.className = 'chat-msg' + (isMe ? ' me' : '') + (isSystem ? ' system' : '');
  
  if (isSystem){
    div.innerHTML = `<span>${msg.text}</span>`;
  } else {
    div.innerHTML = `<span class="chat-author">${escapeHtml(msg.player_name)}:</span><span>${escapeHtml(msg.text)}</span>`;
  }
  
  container.appendChild(div);
  container.scrollTop = container.scrollHeight;

  // Счётчик непрочитанных
  if (isNew && !isMe && !game.chatOpen){
    game.unreadMessages++;
    updateUnreadCounter();
  }
}

function updateUnreadCounter(){
  const el = $('chatUnread');
  if (game.unreadMessages > 0 && !game.chatOpen){
    el.style.display = 'inline-block';
    el.textContent = game.unreadMessages;
  } else {
    el.style.display = 'none';
  }
}

function toggleChat(){
  game.chatOpen = !game.chatOpen;
  $('chatWidget').classList.toggle('collapsed', !game.chatOpen);
  
  if (game.chatOpen){
    game.unreadMessages = 0;
    updateUnreadCounter();
    setTimeout(() => $('chatInput').focus(), 100);
  }
}

$('chatHeader').onclick = toggleChat;
$('chatSend').onclick = (e) => { e.stopPropagation(); sendChatMessage(); };
$('chatInput').addEventListener('click', e => e.stopPropagation());
$('chatInput').addEventListener('keydown', e => {
  if (e.key === 'Enter'){ e.preventDefault(); sendChatMessage(); }
});

// ===== Управление =====
function toggleDoor(side){
  if (!game.running || game.dead) return;
  if (side === 'left'){
    game.leftDoor = !game.leftDoor;
  } else {
    game.rightDoor = !game.rightDoor;
  }
  render();
}

function toggleLight(side){
  if (!game.running || game.dead) return;
  if (side === 'left'){
    game.leftLight = !game.leftLight;
    if (game.leftLight) game.rightLight = false;
  } else {
    game.rightLight = !game.rightLight;
    if (game.rightLight) game.leftLight = false;
  }
  render();
}

function toggleCameras(){
  if (!game.running || game.dead) return;
  game.camerasOpen = !game.camerasOpen;
  if (game.camerasOpen){
    $('camerasOverlay').classList.add('show');
    $('office').classList.add('hidden');
    initCamList();
    updateCamScene();
  } else {
    $('camerasOverlay').classList.remove('show');
    $('office').classList.remove('hidden');
  }
  render();
}

// ===== Камеры =====
function initCamList(){
  const el = $('camList');
  el.innerHTML = '<div class="cam-title">📹 Камеры</div>';
  CAMERAS.forEach(cam => {
    const item = document.createElement('div');
    item.className = 'cam-item' + (cam.id === game.currentCam ? ' active' : '');
    item.dataset.camId = cam.id;
    const numDisplay = cam.num >= 0 ? cam.num : '·';
    item.innerHTML = `
      <span class="num">${numDisplay}</span>
      <span class="emoji">${cam.emoji}</span>
      <span class="name">${cam.name}</span>
    `;
    item.onclick = () => {
      game.currentCam = cam.id;
      document.querySelectorAll('.cam-item').forEach(i => i.classList.remove('active'));
      item.classList.add('active');
      updateCamScene();
    };
    el.appendChild(item);
  });
}

function updateCamScene(){
  const cam = CAMERAS.find(c => c.id === game.currentCam);
  if (!cam) return;
  $('camNameLabel').textContent = cam.name;

  const scene = SCENES[cam.id];
  $('camScene').innerHTML = scene ? scene() : '<div style="color:#64748b;display:flex;align-items:center;justify-content:center;height:100%;font-size:2rem;">📷 Нет сигнала</div>';
  
  addSceneStars();
  
  const mgr = window.SP_CHARS?.Manager;
  if (mgr && mgr.running){
    const charsHere = mgr.getAtCamera(cam.id);
    const count = charsHere.length;
    charsHere.forEach((a, i) => {
      const charEl = document.createElement('div');
      charEl.className = 'cam-char';
      charEl.textContent = a.emoji;
      charEl.style.color = a.color;
      
      let offsetX = 0, offsetY = 0;
      if (cam.id === 'main-stage' && count > 1){
        const spacing = 80;
        offsetX = (i - (count - 1) / 2) * spacing;
        offsetY = -30;
      } else {
        offsetX = (Math.random() - 0.5) * 40;
        offsetY = (Math.random() - 0.5) * 30;
      }
      charEl.style.transform = `translate(calc(-50% + ${offsetX}px), calc(-50% + ${offsetY}px))`;
      $('camScene').appendChild(charEl);
    });
  }
}

function addSceneStars(){
  const stars = document.createElement('div');
  stars.className = 'scene-stars';
  for (let i = 0; i < 40; i++){
    const s = document.createElement('div');
    s.className = 'scene-star';
    s.style.left = Math.random() * 100 + '%';
    s.style.top = Math.random() * 60 + '%';
    s.style.animationDelay = Math.random() * 3 + 's';
    stars.appendChild(s);
  }
  $('camScene').appendChild(stars);
}

const SCENES = {
  'main-stage': () => `
    <div class="stage-scene"></div>
    <div class="stage-curtain-top"></div>
    <div class="stage-curtain-left"></div>
    <div class="stage-curtain-right"></div>
    <div class="stage-podium"></div>
    <div class="stage-spotlight left"></div>
    <div class="stage-spotlight right"></div>
    <div class="stage-sign">🎭 SEASONS PARK — SHOW STAGE</div>
  `,
  carousel: () => {
    let bulbs = '';
    for (let i = 0; i < 12; i++){
      const angle = (i / 12) * Math.PI;
      const x = 50 + Math.cos(angle) * 45;
      const y = 30 + Math.sin(angle) * 30;
      bulbs += `<div class="bulb" style="left:${x}%;top:${y}%;animation-delay:${i*0.1}s;"></div>`;
    }
    return `
      <div class="scene-sky"></div>
      <div class="scene-moon"></div>
      <div class="scene-floor"></div>
      <div class="carousel">
        <div class="pole"></div>
        <div class="wheel">${bulbs}</div>
        <div class="base"></div>
      </div>
    `;
  },
  fountain: () => `
    <div class="scene-sky"></div>
    <div class="scene-moon"></div>
    <div class="scene-floor"></div>
    <div class="fountain">
      <div class="jet"></div>
      <div class="water"></div>
      <div class="basin"></div>
    </div>
  `,
  tree: () => {
    let leaves = '';
    for (let i = 0; i < 8; i++){
      leaves += `<div class="leaf" style="left:${10+i*12}%;animation-delay:${i*0.6}s;">🍂</div>`;
    }
    return `
      <div class="scene-sky"></div>
      <div class="scene-moon"></div>
      <div class="scene-floor"></div>
      <div class="tree">
        <div class="crown"></div>
        <div class="trunk"></div>
        ${leaves}
      </div>
    `;
  },
  slide: () => {
    let flakes = '';
    for (let i = 0; i < 10; i++){
      flakes += `<div class="flake" style="left:${5+i*10}%;animation-delay:${i*0.4}s;">❄</div>`;
    }
    return `
      <div class="scene-sky"></div>
      <div class="scene-moon"></div>
      <div class="scene-floor"></div>
      <div class="slide">
        <div class="ramp"></div>
        <div class="snow"></div>
        ${flakes}
      </div>
    `;
  },
  rink: () => `
    <div class="scene-sky"></div>
    <div class="scene-moon"></div>
    <div class="scene-floor"></div>
    <div class="rink"><div class="ice"></div></div>
  `,
  flowerbed: () => {
    const flowers = ['🌸','🌺','🌷','🌸','🌼','🌺','🌸','🌷','🌸','🌼'];
    return `
      <div class="scene-sky"></div>
      <div class="scene-moon"></div>
      <div class="scene-floor"></div>
      <div class="flowerbed">${flowers.map(f => `<div class="flower">${f}</div>`).join('')}</div>
    `;
  },
  maze: () => `
    <div class="scene-sky"></div>
    <div class="scene-floor"></div>
    <div class="maze">
      <div class="wall" style="top:30%;left:10%;width:30%;height:2px;"></div>
      <div class="wall" style="top:30%;left:10%;width:2px;height:40%;"></div>
      <div class="wall" style="top:50%;right:10%;width:30%;height:2px;"></div>
      <div class="wall" style="top:50%;right:10%;width:2px;height:30%;"></div>
    </div>
  `,
  alley: () => `
    <div class="scene-sky"></div>
    <div class="scene-moon"></div>
    <div class="alley">
      <div class="path"></div>
      <div class="lamp" style="left:20%;"></div>
      <div class="lamp" style="left:45%;bottom:45%;"></div>
      <div class="lamp" style="left:70%;"></div>
    </div>
  `,
  tunnel: () => `<div class="tunnel"></div>`,
  roof: () => `
    <div class="roof">
      <div class="tiles">
        ${Array.from({length:60}).map(() => '<div class="tile"></div>').join('')}
      </div>
    </div>
  `,
};

// ===== Рендер =====
function render(){
  $('clock').textContent = formatTime(game.hour, game.timeInHour);
  const season = SEASONS[game.season];
  $('night-label').textContent = `${game.lobbyName} · Ночь ${game.night} · ${season.emoji}`;

  const e = Math.max(0, Math.min(100, game.energy));
  $('energy-fill').style.width = e + '%';
  $('energy-text').textContent = Math.floor(e) + '%';
  $('energy-fill').className = '';
  if (e < 20) $('energy-fill').classList.add('critical');
  else if (e < 50) $('energy-fill').classList.add('warn');

  $('doorLeft').classList.toggle('closed', game.leftDoor);
  $('doorRight').classList.toggle('closed', game.rightDoor);
  $('btnLeft').classList.toggle('active', game.leftDoor);
  $('btnRight').classList.toggle('active', game.rightDoor);

  $('lightLeft').classList.toggle('on', game.leftLight);
  $('lightRight').classList.toggle('on', game.rightLight);
  $('glowLeft').classList.toggle('on', game.leftLight);
  $('glowRight').classList.toggle('on', game.rightLight);

  renderDoorChars();

  $('camTime').textContent = formatTime(game.hour, game.timeInHour);
  $('camNightInfo').textContent = `Ночь ${game.night} · ${season.name}`;
}

function renderDoorChars(){
  const mgr = window.SP_CHARS?.Manager;
  if (!mgr || !mgr.running){
    $('charLeft').style.display = 'none';
    $('charRight').style.display = 'none';
    $('charCeiling').classList.remove('on');
    return;
  }
  const list = mgr.list;

  const leftChar = list.find(a => a.active && a.state === 'at-door' && a.door === 'left' && a.type !== 'ceiling');
  if (leftChar){
    $('charLeft').textContent = leftChar.emoji;
    $('charLeft').style.color = leftChar.color;
    $('charLeft').style.display = 'block';
  } else {
    $('charLeft').style.display = 'none';
  }

  const rightChar = list.find(a => a.active && a.state === 'at-door' && a.door === 'right' && a.type !== 'ceiling');
  if (rightChar){
    $('charRight').textContent = rightChar.emoji;
    $('charRight').style.color = rightChar.color;
    $('charRight').style.display = 'block';
  } else {
    $('charRight').style.display = 'none';
  }

  const ceilingChar = list.find(a => a.active && a.type === 'ceiling' && a.state === 'at-door');
  if (ceilingChar){
    $('charCeiling').textContent = ceilingChar.emoji;
    $('charCeiling').style.color = ceilingChar.color;
    $('charCeiling').classList.add('on');
  } else {
    $('charCeiling').classList.remove('on');
  }
}

// ===== Проверка атаки =====
window.SP_GAME = {
  canAnimatronicAttack(a){
    if (game.dead) return false;
    if (a.type === 'door'){
      if (a.door === 'left') return !game.leftDoor;
      if (a.door === 'right') return !game.rightDoor;
    }
    if (a.type === 'ceiling') return !game.leftLight && !game.rightLight;
    if (a.type === 'random'){
      if (a.door === 'left') return !game.leftDoor;
      if (a.door === 'right') return !game.rightDoor;
    }
    return false;
  }
};

// ===== Джампскейр =====
function triggerJumpScare(animatronic){
  if (game.dead) return;
  game.dead = true;
  game.running = false;
  
  $('jumpScare').classList.add('show');
  $('scareEmoji').textContent = animatronic.emoji;
  $('scareEmoji').style.color = animatronic.color;
  $('scareText').textContent = animatronic.name.toUpperCase();
  
  updateMyState();
  
  setTimeout(() => {
    $('jumpScare').classList.remove('show');
    showEndScreen();
  }, 2500);
}

function showEndScreen(){
  $('endScreen').className = 'end-screen lose show';
  $('endTitle').textContent = '💀 ВЫ ПОГИБЛИ';
  $('endText').innerHTML = `Вы не дожили до 6:00.<br>Смотрите, кто ещё жив...`;
}

// ===== Игровой цикл =====
let lastTick = 0;
let syncInterval = 0;

function gameLoop(timestamp){
  if (!lastTick) lastTick = timestamp;
  const dt = Math.min((timestamp - lastTick) / 1000, 0.1);
  lastTick = timestamp;

  if (game.running && !game.dead){
    game.timeInHour += dt;
    if (game.timeInHour >= CONFIG.HOUR_DURATION){
      game.timeInHour -= CONFIG.HOUR_DURATION;
      game.hour++;
      if (game.hour >= CONFIG.TOTAL_HOURS){
        winGame();
        return;
      }
    }

    game.energy -= getDrainPerSec() * dt;
    if (game.energy <= 0){
      game.energy = 0;
      game.dead = true;
      game.running = false;
      updateMyState();
      $('endScreen').className = 'end-screen lose show';
      $('endTitle').textContent = '⚡ ЭНЕРГИЯ КОНЧИЛАСЬ';
      $('endText').textContent = 'Вы не дожили до утра.';
      return;
    }

    const mgr = window.SP_CHARS?.Manager;
    if (mgr && mgr.running){
      mgr.update(dt, game.hour);
      if (game.camerasOpen) updateCamScene();
    }

    syncInterval += dt;
    if (syncInterval >= 2){
      syncInterval = 0;
      updateMyState();
    }

    render();
  }

  requestAnimationFrame(gameLoop);
}

async function updateMyState(){
  if (!game.supabase || !PLAYER_ID) return;
  try{
    await game.supabase.from('players').update({
      status: game.dead ? 'dead' : 'alive',
      energy: Math.floor(game.energy),
      hour: game.hour,
      last_seen: new Date().toISOString()
    }).eq('id', PLAYER_ID);
  }catch(e){}
}

function winGame(){
  game.running = false;
  $('endScreen').className = 'end-screen win show';
  $('endTitle').textContent = '🏆 6:00 — ПОБЕДА';
  $('endText').innerHTML = 'Вы дожили до утра!<br>Смотрите, кто ещё жив...';
}

// ===== Инициализация аниматроников =====
function initAnimatronics(){
  if (!window.SP_CHARS) return;
  window.SP_CHARS.initAudio();
  window.SP_CHARS.Manager.onGameOver = (a) => triggerJumpScare(a);
  window.SP_CHARS.Manager.reset(1, null);
}

// ===== Старт игры =====
async function startGame(){
  game.running = true;
  game.dead = false;
  game.hour = 0;
  game.timeInHour = 0;
  game.energy = 100;
  game.leftDoor = false;
  game.rightDoor = false;
  game.leftLight = false;
  game.rightLight = false;
  game.currentCam = 'main-stage';
  document.body.dataset.season = game.season;

  initAnimatronics();
  render();

  try{
    await game.supabase.from('players').update({
      status: 'alive', hour: 0, energy: 100
    }).eq('id', PLAYER_ID);
  }catch(e){}

  addSystemMessage(`🎮 ${game.playerName} начал игру`);
  showToast('🎮 Игра началась!', 'success');
}

// ===== Клавиатура =====
document.addEventListener('keydown', e => {
  // Не перехватываем если пишем в чат
  if (document.activeElement === $('chatInput')) return;

  if (!game.running || game.dead) return;

  if (e.code === 'KeyQ'){ e.preventDefault(); toggleDoor('left'); }
  if (e.code === 'KeyE'){ e.preventDefault(); toggleDoor('right'); }
  if (e.code === 'KeyA' && !e.ctrlKey){ e.preventDefault(); toggleLight('left'); }
  if (e.code === 'KeyD' && !e.ctrlKey){ e.preventDefault(); toggleLight('right'); }
  if (e.code === 'KeyC'){ e.preventDefault(); toggleCameras(); }
  if (e.code === 'KeyT'){ e.preventDefault(); if (!game.chatOpen) toggleChat(); }

  if (e.code === 'ArrowLeft' && game.camerasOpen){
    e.preventDefault();
    const idx = CAMERAS.findIndex(c => c.id === game.currentCam);
    game.currentCam = CAMERAS[(idx-1+CAMERAS.length)%CAMERAS.length].id;
    updateCamScene();
    document.querySelectorAll('.cam-item').forEach(i => i.classList.toggle('active', i.dataset.camId === game.currentCam));
  }
  if (e.code === 'ArrowRight' && game.camerasOpen){
    e.preventDefault();
    const idx = CAMERAS.findIndex(c => c.id === game.currentCam);
    game.currentCam = CAMERAS[(idx+1)%CAMERAS.length].id;
    updateCamScene();
    document.querySelectorAll('.cam-item').forEach(i => i.classList.toggle('active', i.dataset.camId === game.currentCam));
  }
});

// ===== Кнопки =====
$('btnLeft').onclick = () => toggleDoor('left');
$('btnRight').onclick = () => toggleDoor('right');
$('lightLeft').onclick = () => toggleLight('left');
$('lightRight').onclick = () => toggleLight('right');
$('camBtn').onclick = toggleCameras;
$('backBtn').onclick = toggleCameras;
$('prevBtn').onclick = () => {
  const idx = CAMERAS.findIndex(c => c.id === game.currentCam);
  game.currentCam = CAMERAS[(idx-1+CAMERAS.length)%CAMERAS.length].id;
  updateCamScene();
  document.querySelectorAll('.cam-item').forEach(i => i.classList.toggle('active', i.dataset.camId === game.currentCam));
};
$('nextBtn').onclick = () => {
  const idx = CAMERAS.findIndex(c => c.id === game.currentCam);
  game.currentCam = CAMERAS[(idx+1)%CAMERAS.length].id;
  updateCamScene();
  document.querySelectorAll('.cam-item').forEach(i => i.classList.toggle('active', i.dataset.camId === game.currentCam));
};

// ===== Выход =====
window.addEventListener('beforeunload', () => {
  if (game.supabase && PLAYER_ID){
    game.supabase.from('players').update({ status: 'dead' }).eq('id', PLAYER_ID);
  }
});

// ===== Старт =====
initSupabase();
loadLobby().then(() => {
  requestAnimationFrame(gameLoop);
});
