<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Seasons Park — Night Shift</title>
<script src="progress.js"></script>
<style>
  :root{
    --bg:#050810;
    --bg2:#0d1420;
    --accent:#38bdf8;
    --accent2:#a78bfa;
    --gold:#fbbf24;
    --text:#e2e8f0;
    --muted:#64748b;
    --border:#1e293b;
    --danger:#ef4444;
    --success:#4ade80;
    --star:#f472b6;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{height:100%;overflow:hidden;}
  body{
    font-family:system-ui,Segoe UI,Roboto,sans-serif;
    background:radial-gradient(ellipse at 50% 40%, #1a1f3a 0%, #050810 70%);
    color:var(--text);
    display:flex;align-items:center;justify-content:center;
    user-select:none;-webkit-tap-highlight-color:transparent;
    overflow-y:auto;
  }

  .bg-decor{position:fixed;inset:0;pointer-events:none;overflow:hidden;}
  .bg-decor .shape{position:absolute;opacity:.08;font-size:8rem;animation:float 8s ease-in-out infinite;}
  .bg-decor .s1{top:10%;left:5%;animation-delay:0s;}
  .bg-decor .s2{top:60%;right:8%;font-size:10rem;animation-delay:1s;}
  .bg-decor .s3{bottom:10%;left:15%;font-size:6rem;animation-delay:2s;}
  .bg-decor .s4{top:20%;right:20%;font-size:7rem;animation-delay:3s;}
  @keyframes float{
    0%,100%{transform:translateY(0) rotate(0deg);}
    50%{transform:translateY(-20px) rotate(5deg);}
  }

  .stars{position:fixed;inset:0;pointer-events:none;}
  .star{
    position:absolute;width:2px;height:2px;
    background:#fff;border-radius:50%;
    animation:twinkle 3s infinite;
  }
  @keyframes twinkle{
    0%,100%{opacity:.2;}
    50%{opacity:1;}
  }

  /* ===== МЕНЮ ===== */
  .menu{
    position:relative;
    z-index:10;
    text-align:center;
    padding:40px 20px;
    max-width:520px;
    width:100%;
  }

  .logo{
    font-size:5rem;
    margin-bottom:10px;
    animation:rotate 20s linear infinite;
    display:inline-block;
  }
  @keyframes rotate{
    from{transform:rotate(0deg);}
    to{transform:rotate(360deg);}
  }

  h1{
    font-size:2.8rem;
    font-weight:900;
    letter-spacing:5px;
    background:linear-gradient(90deg,var(--accent),var(--accent2),var(--gold));
    -webkit-background-clip:text;background-clip:text;
    -webkit-text-fill-color:transparent;
    margin-bottom:6px;
    text-shadow:0 0 40px rgba(56,189,248,.3);
  }

  .subtitle{
    color:var(--muted);
    font-size:.95rem;
    letter-spacing:8px;
    text-transform:uppercase;
    margin-bottom:20px;
  }

  /* ===== ПРОГРЕСС ===== */
  .progress-info{
    display:flex;
    justify-content:center;
    gap:20px;
    margin-bottom:24px;
    font-size:.85rem;
    color:var(--muted);
  }
  .progress-info .item{
    display:flex;align-items:center;gap:6px;
    background:rgba(30,41,59,.5);
    padding:6px 14px;border-radius:20px;
    border:1px solid var(--border);
  }
  .progress-info .item b{color:var(--text);}
  .progress-info .stars{color:var(--star);}

  .season-row{
    display:flex;
    justify-content:center;
    gap:20px;
    margin-bottom:30px;
    font-size:2rem;
  }
  .season-row span{
    animation:float 3s ease-in-out infinite;
    display:inline-block;
  }
  .season-row span:nth-child(1){animation-delay:0s;}
  .season-row span:nth-child(2){animation-delay:.3s;}
  .season-row span:nth-child(3){animation-delay:.6s;}
  .season-row span:nth-child(4){animation-delay:.9s;}

  /* ===== КНОПКИ ===== */
  .menu-buttons{
    display:flex;
    flex-direction:column;
    gap:10px;
    margin-bottom:24px;
  }

  .btn{
    padding:14px 22px;
    border:2px solid var(--border);
    border-radius:12px;
    background:rgba(30,41,59,.6);
    color:var(--text);
    font:inherit;
    font-size:1rem;
    font-weight:600;
    cursor:pointer;
    transition:all .25s;
    display:flex;
    align-items:center;
    justify-content:space-between;
    text-decoration:none;
    position:relative;
    overflow:hidden;
    width:100%;
    text-align:left;
  }
  .btn:hover{
    border-color:var(--accent);
    transform:translateX(6px);
    background:rgba(56,189,248,.1);
    box-shadow:0 0 25px rgba(56,189,248,.3);
  }
  .btn:active{transform:translateX(6px) scale(.98);}

  .btn .label{display:flex;align-items:center;gap:14px;}
  .btn .icon{font-size:1.3rem;}
  .btn .arrow{
    color:var(--muted);
    transition:transform .25s,color .25s;
    font-size:.9rem;
  }
  .btn:hover .arrow{
    transform:translateX(4px);
    color:var(--accent);
  }
  .btn .badge{
    background:rgba(56,189,248,.2);
    color:var(--accent);
    padding:2px 8px;
    border-radius:10px;
    font-size:.75rem;
    font-weight:700;
    margin-left:8px;
  }

  .btn.primary{
    border-color:var(--accent);
    background:linear-gradient(90deg,rgba(56,189,248,.2),rgba(167,139,250,.2));
    font-size:1.15rem;
    padding:18px 26px;
    box-shadow:0 0 30px rgba(56,189,248,.2);
  }
  .btn.primary:hover{
    box-shadow:0 0 40px rgba(56,189,248,.5);
    transform:translateX(6px) scale(1.02);
  }

  .btn.mp{
    border-color:var(--gold);
    background:linear-gradient(90deg,rgba(251,191,36,.1),rgba(251,191,36,.05));
  }
  .btn.mp:hover{
    border-color:var(--gold);
    background:rgba(251,191,36,.15);
    box-shadow:0 0 25px rgba(251,191,36,.3);
  }
  .btn.mp:hover .arrow{color:var(--gold);}

  .btn.danger{
    border-color:rgba(239,68,68,.4);
    background:rgba(239,68,68,.05);
  }
  .btn.danger:hover{
    border-color:var(--danger);
    background:rgba(239,68,68,.15);
    box-shadow:0 0 25px rgba(239,68,68,.3);
  }
  .btn.danger:hover .arrow{color:var(--danger);}

  .btn.secret{
    border-color:var(--star);
    background:linear-gradient(90deg,rgba(244,114,182,.15),rgba(167,139,250,.15));
    animation:secretPulse 2s infinite;
  }
  @keyframes secretPulse{
    0%,100%{box-shadow:0 0 20px rgba(244,114,182,.3);}
    50%{box-shadow:0 0 40px rgba(244,114,182,.6);}
  }
  .btn.secret:hover .arrow{color:var(--star);}

  .version{
    color:var(--muted);
    font-size:.75rem;
    letter-spacing:2px;
    margin-top:20px;
  }
  .version a{color:var(--accent);text-decoration:none;}

  /* ===== МОДАЛКА ===== */
  .modal-bg{
    position:fixed;inset:0;
    background:rgba(0,0,0,.85);
    display:none;align-items:center;justify-content:center;
    z-index:100;padding:20px;
    backdrop-filter:blur(4px);
  }
  .modal-bg.open{display:flex;}
  .modal{
    background:var(--bg2);
    border:2px solid var(--accent);
    border-radius:16px;
    padding:28px;
    max-width:420px;
    width:100%;
    animation:modalIn .3s ease;
    box-shadow:0 0 60px rgba(56,189,248,.3);
  }
  @keyframes modalIn{
    from{transform:scale(.9);opacity:0;}
    to{transform:scale(1);opacity:1;}
  }
  .modal h2{color:var(--accent);margin-bottom:20px;font-size:1.3rem;}
  .modal .setting{margin-bottom:16px;}
  .modal .setting label{
    display:block;color:var(--muted);
    font-size:.8rem;letter-spacing:1px;
    text-transform:uppercase;margin-bottom:6px;
  }
  .modal .setting .row{display:flex;gap:8px;flex-wrap:wrap;}
  .modal .setting button{
    flex:1;min-width:80px;padding:10px;
    background:#0a0f18;border:2px solid var(--border);
    border-radius:8px;color:var(--text);
    cursor:pointer;font:inherit;font-size:.85rem;transition:all .2s;
  }
  .modal .setting button.active{
    background:linear-gradient(90deg,var(--accent),var(--accent2));
    color:#0f172a;font-weight:700;border-color:transparent;
  }
  .modal .setting button:hover:not(.active){border-color:var(--accent);}
  .modal .close-row{display:flex;gap:10px;margin-top:24px;}
  .modal .close-row button{
    flex:1;padding:12px;border-radius:10px;
    cursor:pointer;font:inherit;font-weight:600;
    border:none;transition:transform .15s;
  }
  .modal .close-row button:hover{transform:translateY(-2px);}
  .modal .close-row .save{
    background:linear-gradient(90deg,var(--accent),var(--accent2));
    color:#0f172a;
  }
  .modal .close-row .cancel{background:#1e293b;color:var(--text);}
  .modal .close-row .danger-btn{background:var(--danger);color:#fff;}

  /* ===== TOAST ===== */
  #toast{position:fixed;top:20px;left:50%;transform:translateX(-50%) translateY(-100px);background:var(--accent);color:#0f172a;padding:12px 24px;border-radius:10px;font-weight:700;z-index:300;transition:transform .3s;box-shadow:0 10px 30px rgba(56,189,248,.4);pointer-events:none;}
  #toast.show{transform:translateX(-50%) translateY(0);}
  #toast.success{background:var(--success);}
  #toast.danger{background:var(--danger);color:#fff;}
  #toast.gold{background:var(--gold);}

  @media (max-width:500px){
    h1{font-size:1.8rem;letter-spacing:3px;}
    .logo{font-size:3.5rem;}
    .subtitle{letter-spacing:4px;font-size:.8rem;margin-bottom:14px;}
    .btn{font-size:.9rem;padding:12px 16px;}
    .btn.primary{font-size:1rem;padding:14px 18px;}
    .season-row{font-size:1.5rem;gap:12px;margin-bottom:20px;}
    .menu{padding:20px 14px;}
    .progress-info{font-size:.75rem;gap:10px;flex-wrap:wrap;}
  }
</style>
</head>
<body>

<div class="stars" id="stars"></div>

<div class="bg-decor">
  <div class="shape s1">🎡</div>
  <div class="shape s2">🎢</div>
  <div class="shape s3">🎠</div>
  <div class="shape s4">🎪</div>
</div>

<div class="menu">
  <div class="logo">🎡</div>
  <h1>SEASONS PARK</h1>
  <div class="subtitle">Night Shift</div>

  <div class="progress-info" id="progressInfo" style="display:none;">
    <div class="item">
      🌙 Ночь: <b id="progressNight">1</b>
    </div>
    <div class="item">
      <span class="stars">⭐</span> <b id="progressStars">0</b>
    </div>
  </div>

  <div class="season-row">
    <span>☀️</span>
    <span>🍁</span>
    <span>❄️</span>
    <span>🌸</span>
  </div>

  <div class="menu-buttons" id="menuButtons"></div>

  <div class="version">
    v0.3 · Build 2026-10-04 · <a href="admin.html">admin</a>
  </div>
</div>

<!-- Модалка настроек -->
<div class="modal-bg" id="settingsModal">
  <div class="modal">
    <h2>⚙️ Настройки</h2>

    <div class="setting" data-key="volume">
      <label>Громкость</label>
      <div class="row">
        <button type="button" data-value="off">🔇 Выкл</button>
        <button type="button" data-value="low">🔉 Тихо</button>
        <button type="button" data-value="mid">🔊 Средне</button>
        <button type="button" data-value="high">🔊 Громко</button>
      </div>
    </div>

    <div class="setting" data-key="difficulty">
      <label>Сложность</label>
      <div class="row">
        <button type="button" data-value="easy">😌 Легко</button>
        <button type="button" data-value="normal">😐 Норма</button>
        <button type="button" data-value="hard">😨 Сложно</button>
      </div>
    </div>

    <div class="setting" data-key="effects">
      <label>Эффекты</label>
      <div class="row">
        <button type="button" data-value="low">Минимум</button>
        <button type="button" data-value="mid">Средне</button>
        <button type="button" data-value="high">Максимум</button>
      </div>
    </div>

    <div class="close-row">
      <button class="cancel" id="settingsCancel" type="button">Отмена</button>
      <button class="save" id="settingsSave" type="button">Сохранить</button>
    </div>
  </div>
</div>

<!-- Модалка сброса -->
<div class="modal-bg" id="resetModal">
  <div class="modal">
    <h2 style="color:var(--danger);">⚠️ Сброс прогресса</h2>
    <p style="color:var(--muted);margin-bottom:20px;font-size:.9rem;line-height:1.6;">
      Вы уверены, что хотите сбросить весь прогресс?<br>
      Все пройденные ночи, рекорды и открытия будут удалены.<br>
      <b style="color:var(--star);">Звёзды сохранятся</b> — это ваша заслуга.
    </p>
    <div class="close-row">
      <button class="cancel" id="resetCancel" type="button">Отмена</button>
      <button class="danger-btn" id="resetConfirm" type="button">Сбросить</button>
    </div>
  </div>
</div>

<div id="toast"></div>

<script>
// ============================================================
// index.html — Главное меню с прогрессом
// ============================================================

const $ = id => document.getElementById(id);

// ===== Звёзды =====
(function makeStars(){
  const container = $('stars');
  for (let i = 0; i < 80; i++){
    const star = document.createElement('div');
    star.className = 'star';
    star.style.left = Math.random() * 100 + '%';
    star.style.top = Math.random() * 100 + '%';
    star.style.animationDelay = Math.random() * 3 + 's';
    star.style.opacity = Math.random() * 0.7 + 0.1;
    if (Math.random() > 0.9){
      star.style.width = '3px';
      star.style.height = '3px';
      star.style.boxShadow = '0 0 6px #fff';
    }
    container.appendChild(star);
  }
})();

// ===== Toast =====
function showToast(text, type = ''){
  const t = $('toast');
  t.textContent = text;
  t.className = 'show ' + type;
  clearTimeout(t._t);
  t._t = setTimeout(() => { t.className = type; }, 2500);
}

// ===== Построение меню =====
function buildMenu(){
  const progress = SP.get();
  const container = $('menuButtons');
  container.innerHTML = '';

  const anyProgress = progress.night1 || progress.night2 || progress.night3 ||
                      progress.night4 || progress.night5 || progress.night6;

  if (anyProgress){
    $('progressInfo').style.display = 'flex';
    $('progressNight').textContent = progress.currentNight;
    $('progressStars').textContent = progress.stars;
  }

  // ===== Продолжить / Играть =====
  if (anyProgress){
    const night = progress.currentNight;
    let label, href, isSecret = false;

    if (night === 6 && progress.night5 && !progress.night6){
      isSecret = true;
      label = 'Продолжить (Секретная ночь)';
      href = 'game.html?night=6';
    } else if (progress.customUnlocked && progress.night6){
      label = 'Продолжить (Кастомная ночь)';
      href = 'custom-night.html';
    } else {
      label = `Продолжить (Ночь ${night})`;
      href = `game.html?night=${night}`;
    }

    const btn = document.createElement('a');
    btn.href = href;
    btn.className = 'btn primary' + (isSecret ? ' secret' : '');
    btn.innerHTML = `
      <span class="label"><span class="icon">▶️</span> ${label}</span>
      <span class="arrow">→</span>
    `;
    container.appendChild(btn);
  } else {
    const btn = document.createElement('a');
    btn.href = 'game.html?night=1';
    btn.className = 'btn primary';
    btn.innerHTML = `
      <span class="label"><span class="icon">▶️</span> Играть</span>
      <span class="arrow">→</span>
    `;
    container.appendChild(btn);
  }

  // ===== Выбор ночи =====
  const nightsBtn = document.createElement('a');
  nightsBtn.href = 'nights.html';
  nightsBtn.className = 'btn';
  const unlockedCount = [1,2,3,4,5,6].filter(n => SP.isNightUnlocked(n)).length;
  nightsBtn.innerHTML = `
    <span class="label"><span class="icon">🌙</span> Выбор ночи <span class="badge">${unlockedCount}/6</span></span>
    <span class="arrow">→</span>
  `;
  container.appendChild(nightsBtn);

  // ===== Кастомная ночь =====
  if (SP.isCustomUnlocked()){
    const customBtn = document.createElement('a');
    customBtn.href = 'custom-night.html';
    customBtn.className = 'btn';
    customBtn.innerHTML = `
      <span class="label"><span class="icon">🎨</span> Кастомная ночь</span>
      <span class="arrow">→</span>
    `;
    container.appendChild(customBtn);
  }

  // ===== Начать заново =====
  if (anyProgress){
    const resetBtn = document.createElement('button');
    resetBtn.type = 'button';
    resetBtn.className = 'btn danger';
    resetBtn.innerHTML = `
      <span class="label"><span class="icon">🔄</span> Начать заново</span>
      <span class="arrow">→</span>
    `;
    resetBtn.onclick = () => $('resetModal').classList.add('open');
    container.appendChild(resetBtn);
  }

  // ===== Мультиплеер =====
  const mpBtn = document.createElement('a');
  mpBtn.href = 'multiplayer.html';
  mpBtn.className = 'btn mp';
  mpBtn.innerHTML = `
    <span class="label"><span class="icon">🌍</span> Мультиплеер</span>
    <span class="arrow">→</span>
  `;
  container.appendChild(mpBtn);

  // ===== Прогулка по парку (переименовано) =====
  const walkBtn = document.createElement('a');
  walkBtn.href = 'cameras.html';
  walkBtn.className = 'btn';
  walkBtn.innerHTML = `
    <span class="label"><span class="icon">🎡</span> Прогулка по парку</span>
    <span class="arrow">→</span>
  `;
  container.appendChild(walkBtn);

  // ===== Достижения =====
  const achBtn = document.createElement('a');
  achBtn.href = 'achievements.html';
  achBtn.className = 'btn';
  achBtn.innerHTML = `
    <span class="label"><span class="icon">🏆</span> Достижения</span>
    <span class="arrow">→</span>
  `;
  container.appendChild(achBtn);

  // ===== История =====
  const storyBtn = document.createElement('a');
  storyBtn.href = 'story.html';
  storyBtn.className = 'btn';
  storyBtn.innerHTML = `
    <span class="label"><span class="icon">📖</span> История парка</span>
    <span class="arrow">→</span>
  `;
  container.appendChild(storyBtn);

  // ===== Настройки =====
  const settingsBtn = document.createElement('button');
  settingsBtn.type = 'button';
  settingsBtn.className = 'btn';
  settingsBtn.id = 'settingsBtn';
  settingsBtn.innerHTML = `
    <span class="label"><span class="icon">⚙️</span> Настройки</span>
    <span class="arrow">→</span>
  `;
  settingsBtn.onclick = openSettings;
  container.appendChild(settingsBtn);
}

// ===== Настройки =====
function openSettings(){
  const settings = SP.getSettings();
  document.querySelectorAll('.modal .setting').forEach(row => {
    const key = row.dataset.key;
    if (!key) return;
    const currentValue = settings[key];
    row.querySelectorAll('button[data-value]').forEach(btn => {
      btn.classList.toggle('active', btn.dataset.value === currentValue);
    });
  });
  $('settingsModal').classList.add('open');
}

function closeSettings(){
  $('settingsModal').classList.remove('open');
}

function saveSettings(){
  document.querySelectorAll('.modal .setting').forEach(row => {
    const key = row.dataset.key;
    const active = row.querySelector('button.active');
    if (key && active){
      SP.setSetting(key, active.dataset.value);
    }
  });
  closeSettings();
  showToast('✅ Настройки сохранены', 'success');
}

document.querySelectorAll('.modal .setting button[data-value]').forEach(btn => {
  btn.addEventListener('click', () => {
    const row = btn.closest('.setting');
    row.querySelectorAll('button[data-value]').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
  });
});

$('settingsCancel').addEventListener('click', closeSettings);
$('settingsSave').addEventListener('click', saveSettings);
$('settingsModal').addEventListener('click', e => {
  if (e.target.id === 'settingsModal') closeSettings();
});

// ===== Сброс =====
$('resetCancel').addEventListener('click', () => $('resetModal').classList.remove('open'));
$('resetConfirm').addEventListener('click', () => {
  SP.reset(true);
  $('resetModal').classList.remove('open');
  showToast('🔄 Прогресс сброшен', 'gold');
  setTimeout(() => buildMenu(), 300);
});
$('resetModal').addEventListener('click', e => {
  if (e.target.id === 'resetModal') $('resetModal').classList.remove('open');
});

document.addEventListener('keydown', e => {
  if (e.key === 'Escape'){
    closeSettings();
    $('resetModal').classList.remove('open');
  }
});

// ===== Старт =====
buildMenu();

const params = new URLSearchParams(location.search);
if (params.has('toast')){
  showToast(params.get('toast'), 'success');
}

console.log('%c🎡 Seasons Park — index.html','font-size:18px;color:#38bdf8;font-weight:bold;');
console.log('%cПрогресс:', 'color:#4ade80;', SP.get());
</script>
</body>
</html>
