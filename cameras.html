<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Seasons Park — Прогулка по парку</title>
<script src="progress.js"></script>
<style>
  :root{
    --bg:#050810;
    --panel:#0a0f18;
    --card:#0d1420;
    --accent:#38bdf8;
    --accent2:#a78bfa;
    --danger:#ef4444;
    --success:#4ade80;
    --gold:#fbbf24;
    --star:#f472b6;
    --text:#e2e8f0;
    --muted:#64748b;
    --border:#1e293b;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{height:100%;overflow:hidden;}
  body{
    font-family:system-ui,Segoe UI,Roboto,sans-serif;
    background:var(--bg);color:var(--text);
    user-select:none;-webkit-tap-highlight-color:transparent;
  }

  #app{
    display:grid;
    grid-template-columns:260px 1fr;
    height:100vh;
    width:100vw;
  }

  /* ===== БОКОВАЯ ПАНЕЛЬ ===== */
  #sidebar{
    background:var(--panel);
    border-right:2px solid var(--border);
    overflow-y:auto;
    padding:14px;
    display:flex;
    flex-direction:column;
    gap:6px;
  }
  #sidebar::-webkit-scrollbar{width:6px;}
  #sidebar::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px;}

  .sidebar-header{
    padding-bottom:14px;
    border-bottom:1px solid var(--border);
    margin-bottom:10px;
  }
  .sidebar-header h1{
    font-size:1.2rem;
    font-weight:900;
    background:linear-gradient(90deg,var(--accent),var(--accent2),var(--gold));
    -webkit-background-clip:text;background-clip:text;
    -webkit-text-fill-color:transparent;
    letter-spacing:2px;
    margin-bottom:4px;
  }
  .sidebar-header .sub{
    color:var(--muted);
    font-size:.7rem;
    letter-spacing:2px;
    text-transform:uppercase;
  }
  .sidebar-header .mode{
    display:inline-block;
    margin-top:8px;
    padding:3px 10px;
    background:rgba(56,189,248,.15);
    border:1px solid var(--accent);
    border-radius:20px;
    font-size:.65rem;
    color:var(--accent);
    letter-spacing:1px;
    text-transform:uppercase;
    font-weight:700;
  }

  .cam-section-title{
    color:var(--muted);
    font-size:.65rem;
    letter-spacing:3px;
    text-transform:uppercase;
    margin:10px 6px 6px;
    font-weight:700;
  }

  .cam-item{
    padding:10px 12px;
    background:var(--card);
    border:1px solid var(--border);
    border-radius:8px;
    cursor:pointer;
    transition:all .2s;
    font-size:.85rem;
    display:flex;
    align-items:center;
    gap:10px;
  }
  .cam-item:hover{
    border-color:var(--accent);
    transform:translateX(3px);
  }
  .cam-item.active{
    background:linear-gradient(90deg,var(--accent),var(--accent2));
    color:#0f172a;
    font-weight:700;
    border-color:transparent;
  }
  .cam-item .num{
    font-family:monospace;
    font-size:.75rem;
    opacity:.7;
    min-width:20px;
  }
  .cam-item .emoji{font-size:1.2rem;}
  .cam-item .name{flex:1;}

  .back-menu{
    margin-top:auto;
    padding:12px;
    background:rgba(30,41,59,.6);
    border:2px solid var(--border);
    border-radius:10px;
    color:var(--text);
    text-decoration:none;
    font-size:.85rem;
    font-weight:600;
    transition:all .2s;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:8px;
  }
  .back-menu:hover{
    border-color:var(--accent);
    color:var(--accent);
  }

  /* ===== ПРОСМОТР КАМЕРЫ ===== */
  #camView{
    position:relative;
    overflow:hidden;
    background:#000;
    cursor:crosshair;
  }

  #camView::before{
    content:'';
    position:absolute;inset:0;
    pointer-events:none;
    z-index:10;
    background:repeating-linear-gradient(
      0deg,
      rgba(0,0,0,.15) 0px,
      rgba(0,0,0,.15) 1px,
      transparent 1px,
      transparent 3px
    );
  }
  #camView::after{
    content:'';
    position:absolute;inset:0;
    pointer-events:none;
    z-index:11;
    background:radial-gradient(ellipse at center, transparent 40%, rgba(0,0,0,.75) 100%);
  }

  #noise{
    position:absolute;inset:0;
    pointer-events:none;
    z-index:9;
    opacity:.06;
    background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
    animation:noiseMove .1s infinite;
  }
  @keyframes noiseMove{
    0%{transform:translate(0,0);}
    100%{transform:translate(-5%,-5%);}
  }

  /* Фонарик */
  #flashlightDarkness{
    position:absolute;inset:0;
    z-index:8;
    pointer-events:none;
    background:radial-gradient(
      circle var(--flashlight-size, 280px) at var(--flashlight-x, 50%) var(--flashlight-y, 50%),
      transparent 0%,
      rgba(0,0,0,.2) 40%,
      rgba(0,0,0,.75) 70%,
      rgba(0,0,0,.95) 100%
    );
    opacity:0;
    transition:opacity .2s;
  }
  #flashlightDarkness.on{opacity:1;}

  /* Заголовок камеры */
  #camLabel{
    position:absolute;top:20px;left:20px;
    z-index:12;
    background:rgba(0,0,0,.75);
    border:1px solid var(--accent);
    border-radius:8px;
    padding:10px 18px;
    display:flex;
    flex-direction:column;
    gap:4px;
  }
  #camLabel .cam-num{
    font-size:.65rem;
    color:var(--muted);
    letter-spacing:3px;
    text-transform:uppercase;
  }
  #camLabel .cam-name{
    font-size:1.1rem;
    font-weight:700;
    color:var(--accent);
    letter-spacing:1px;
  }
  #camLabel .cam-season{
    font-size:.75rem;
    color:var(--muted);
    display:flex;
    align-items:center;
    gap:6px;
  }

  /* Кнопки управления */
  #controls{
    position:absolute;
    bottom:20px;
    left:20px;
    right:20px;
    z-index:12;
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:10px;
  }
  .nav-buttons{display:flex;gap:8px;}
  .nav-btn{
    width:56px;height:56px;
    background:rgba(30,41,59,.9);
    border:2px solid var(--border);
    border-radius:12px;
    color:var(--text);
    font-size:1.3rem;
    cursor:pointer;
    transition:all .2s;
    display:flex;align-items:center;justify-content:center;
  }
  .nav-btn:hover{
    border-color:var(--accent);
    color:var(--accent);
    background:rgba(56,189,248,.15);
    transform:translateY(-2px);
  }
  .nav-btn:disabled{opacity:.3;cursor:not-allowed;transform:none;}

  #flashlightBtn{
    width:56px;height:56px;
    background:rgba(0,0,0,.85);
    border:2px solid var(--border);
    border-radius:12px;
    color:var(--muted);
    font-size:1.5rem;
    cursor:pointer;
    transition:all .2s;
    display:flex;align-items:center;justify-content:center;
  }
  #flashlightBtn:hover{
    border-color:var(--accent);
    color:var(--accent);
  }
  #flashlightBtn.on{
    background:var(--gold);
    border-color:var(--gold);
    color:#0f172a;
    box-shadow:0 0 25px rgba(251,191,36,.5);
  }

  /* Инфо о локации внизу */
  #camInfo{
    position:absolute;
    bottom:90px;
    left:20px;
    right:20px;
    z-index:12;
    background:rgba(0,0,0,.75);
    border:1px solid var(--border);
    border-left:3px solid var(--accent);
    border-radius:10px;
    padding:10px 16px;
    color:var(--muted);
    font-size:.85rem;
    line-height:1.5;
    max-width:500px;
  }
  #camInfo b{color:var(--accent);}

  /* ===== СЦЕНА ===== */
  #scene{position:absolute;inset:0;z-index:1;}

  .scene-sky{position:absolute;inset:0;background:linear-gradient(180deg, #050810 0%, #0a0f18 50%, #0d1420 100%);}
  .scene-floor{position:absolute;bottom:0;left:0;right:0;height:45%;background:linear-gradient(180deg, transparent, #0a0f18);}
  .scene-moon{
    position:absolute;top:15%;right:15%;
    width:80px;height:80px;
    background:radial-gradient(circle, #fef3c7 0%, #fbbf24 60%, transparent 70%);
    border-radius:50%;
    opacity:.4;
    box-shadow:0 0 60px rgba(251,191,36,.3);
  }
  .scene-stars{position:absolute;inset:0;pointer-events:none;}
  .scene-star{
    position:absolute;
    width:2px;height:2px;
    background:#fff;
    border-radius:50%;
    opacity:.3;
    animation:twinkle 3s infinite;
  }
  @keyframes twinkle{50%{opacity:1;}}

  /* === ЛОКАЦИИ === */
  .carousel{position:absolute;bottom:25%;left:50%;transform:translateX(-50%);width:300px;height:200px;}
  .carousel .wheel{
    position:absolute;bottom:40px;left:50%;
    transform:translateX(-50%);
    width:220px;height:140px;
    border:4px solid #334155;
    border-radius:50% 50% 0 0;
    border-bottom:none;
    animation:carouselSpin 8s linear infinite;
  }
  @keyframes carouselSpin{
    0%{transform:translateX(-50%) rotate(-3deg);}
    50%{transform:translateX(-50%) rotate(3deg);}
    100%{transform:translateX(-50%) rotate(-3deg);}
  }
  .carousel .bulb{
    position:absolute;
    width:8px;height:8px;
    border-radius:50%;
    background:var(--gold);
    box-shadow:0 0 10px var(--gold);
    animation:bulbBlink 1.5s infinite;
  }
  @keyframes bulbBlink{50%{opacity:.3;}}
  .carousel .base{
    position:absolute;bottom:0;left:50%;
    transform:translateX(-50%);
    width:240px;height:40px;
    background:linear-gradient(180deg,#1e293b,#0d1420);
    border-radius:6px;
    border:2px solid #334155;
  }
  .carousel .pole{
    position:absolute;bottom:40px;left:50%;
    transform:translateX(-50%);
    width:6px;height:100px;
    background:#334155;
  }

  .fountain{position:absolute;bottom:20%;left:50%;transform:translateX(-50%);width:280px;height:220px;}
  .fountain .basin{
    position:absolute;bottom:0;left:50%;
    transform:translateX(-50%);
    width:260px;height:60px;
    background:linear-gradient(180deg,#1e293b,#0a0f18);
    border:3px solid #334155;
    border-radius:0 0 50% 50% / 0 0 100% 100%;
  }
  .fountain .water{
    position:absolute;bottom:60px;left:50%;
    transform:translateX(-50%);
    width:200px;height:8px;
    background:linear-gradient(90deg,transparent,#38bdf8,transparent);
    border-radius:50%;
    animation:waterFlow 2s ease-in-out infinite;
  }
  @keyframes waterFlow{
    0%,100%{width:180px;opacity:.6;}
    50%{width:220px;opacity:1;}
  }
  .fountain .jet{
    position:absolute;bottom:60px;left:50%;
    transform:translateX(-50%);
    width:4px;
    background:linear-gradient(0deg,#38bdf8,transparent);
    border-radius:2px;
    animation:jetUp 2s infinite;
  }
  @keyframes jetUp{
    0%{height:0;opacity:0;}
    20%{height:100px;opacity:1;}
    100%{height:140px;opacity:0;}
  }

  .tree{position:absolute;bottom:20%;left:50%;transform:translateX(-50%);width:200px;height:280px;}
  .tree .trunk{
    position:absolute;bottom:0;left:50%;
    transform:translateX(-50%);
    width:30px;height:100px;
    background:linear-gradient(90deg,#1e293b,#334155,#1e293b);
  }
  .tree .crown{
    position:absolute;bottom:80px;left:50%;
    transform:translateX(-50%);
    width:180px;height:160px;
    background:radial-gradient(circle,#4ade80 0%, #16a34a 50%, transparent 70%);
    border-radius:50%;
    opacity:.5;
    animation:treeSway 4s ease-in-out infinite;
  }
  @keyframes treeSway{
    0%,100%{transform:translateX(-50%) rotate(-2deg);}
    50%{transform:translateX(-50%) rotate(2deg);}
  }
  .tree .leaf{
    position:absolute;
    font-size:1.2rem;
    animation:leafFall 5s linear infinite;
  }
  @keyframes leafFall{
    0%{transform:translateY(-50px) rotate(0deg);opacity:1;}
    100%{transform:translateY(150px) rotate(360deg);opacity:0;}
  }

  .slide{position:absolute;bottom:15%;left:50%;transform:translateX(-50%);width:340px;height:280px;}
  .slide .ramp{
    position:absolute;bottom:0;
    width:100%;height:100%;
    background:linear-gradient(135deg, transparent 40%, #38bdf8 50%, #0ea5e9 60%, transparent 100%);
    opacity:.4;
    clip-path:polygon(0% 100%, 50% 20%, 100% 100%);
  }
  .slide .snow{
    position:absolute;bottom:0;left:0;right:0;
    height:60px;
    background:linear-gradient(180deg, #e0f2fe, #bae6fd);
    opacity:.3;
    border-radius:50% 50% 0 0;
  }
  .slide .flake{
    position:absolute;
    color:#e0f2fe;
    font-size:.9rem;
    animation:snowFall 4s linear infinite;
    opacity:.7;
  }
  @keyframes snowFall{
    0%{transform:translateY(-30px) rotate(0deg);opacity:0;}
    20%{opacity:.7;}
    100%{transform:translateY(200px) rotate(180deg);opacity:0;}
  }

  .rink{position:absolute;bottom:20%;left:50%;transform:translateX(-50%);width:380px;height:180px;}
  .rink .ice{
    position:absolute;bottom:0;left:0;right:0;
    height:120px;
    background:linear-gradient(180deg, rgba(56,189,248,.2), rgba(56,189,248,.4));
    border:2px solid rgba(56,189,248,.5);
    border-radius:50% / 30%;
    animation:iceShimmer 3s ease-in-out infinite;
  }
  @keyframes iceShimmer{
    0%,100%{opacity:.6;}
    50%{opacity:.9;}
  }

  .flowerbed{
    position:absolute;bottom:20%;left:50%;transform:translateX(-50%);
    width:380px;height:180px;
    display:flex;flex-wrap:wrap;justify-content:center;align-items:flex-end;
    gap:14px;padding:0 20px;
  }
  .flower{
    font-size:1.6rem;
    animation:flowerSway 3s ease-in-out infinite;
    filter:drop-shadow(0 0 8px rgba(244,114,182,.4));
  }
  .flower:nth-child(2n){animation-delay:.5s;}
  .flower:nth-child(3n){animation-delay:1s;}
  @keyframes flowerSway{
    0%,100%{transform:rotate(-5deg);}
    50%{transform:rotate(5deg);}
  }

  .maze{position:absolute;inset:10%;border:2px solid rgba(167,139,250,.3);border-radius:8px;}
  .maze::before, .maze::after{content:'';position:absolute;background:rgba(167,139,250,.2);}
  .maze::before{top:20%;left:0;right:0;height:2px;}
  .maze::after{top:60%;left:0;right:0;height:2px;}
  .maze .wall{position:absolute;background:rgba(167,139,250,.25);}

  .alley{position:absolute;inset:0;}
  .alley .path{
    position:absolute;bottom:0;left:50%;transform:translateX(-50%);
    width:200px;height:100%;
    background:linear-gradient(180deg, transparent, rgba(100,116,139,.15));
    clip-path:polygon(35% 0%, 65% 0%, 100% 100%, 0% 100%);
  }
  .alley .lamp{position:absolute;bottom:40%;width:4px;height:80px;background:#334155;}
  .alley .lamp::after{
    content:'';position:absolute;
    top:-10px;left:50%;transform:translateX(-50%);
    width:24px;height:14px;
    background:radial-gradient(circle, var(--gold), transparent);
    border-radius:50%;
    box-shadow:0 0 30px var(--gold);
    animation:lampFlicker 4s infinite;
  }
  @keyframes lampFlicker{
    0%,100%{opacity:.9;}
    45%{opacity:.3;}
    47%{opacity:.9;}
    48%{opacity:.2;}
    50%{opacity:.9;}
  }

  .tunnel{position:absolute;inset:0;background:radial-gradient(ellipse at center, #0a0f18 0%, #000 80%);}
  .tunnel::before{
    content:'';position:absolute;
    top:50%;left:50%;transform:translate(-50%,-50%);
    width:60%;height:60%;
    border:3px solid #1e293b;border-radius:50%;
    animation:tunnelPulse 4s infinite;
  }
  @keyframes tunnelPulse{
    0%,100%{transform:translate(-50%,-50%) scale(1);opacity:.5;}
    50%{transform:translate(-50%,-50%) scale(1.05);opacity:.8;}
  }

  .roof{position:absolute;inset:0;background:linear-gradient(180deg, #1e1b4b 0%, #0a0f18 100%);}
  .roof .tiles{
    position:absolute;inset:0;
    display:grid;
    grid-template-columns:repeat(10,1fr);
    grid-template-rows:repeat(6,1fr);
    gap:2px;padding:20px;
  }
  .roof .tile{background:linear-gradient(180deg,#334155,#1e293b);border-radius:2px;}

  /* ===== TOAST ===== */
  #toast{
    position:fixed;top:20px;left:50%;
    transform:translateX(-50%) translateY(-100px);
    background:var(--accent);color:#0f172a;
    padding:12px 24px;border-radius:10px;
    font-weight:700;z-index:300;
    transition:transform .3s;
    box-shadow:0 10px 30px rgba(56,189,248,.4);
    pointer-events:none;
  }
  #toast.show{transform:translateX(-50%) translateY(0);}
  #toast.gold{background:var(--gold);}

  /* ===== МОБИЛЬНЫЙ ===== */
  @media (max-width:700px){
    #app{grid-template-columns:70px 1fr;}
    .sidebar-header{padding-bottom:8px;}
    .sidebar-header h1{font-size:.9rem;}
    .sidebar-header .sub,.sidebar-header .mode{display:none;}
    .cam-item{padding:8px;justify-content:center;}
    .cam-item .name,.cam-item .num{display:none;}
    .cam-item .emoji{font-size:1.5rem;}
    .cam-section-title{display:none;}
    .back-menu span{display:none;}
    #camInfo{font-size:.75rem;padding:8px 12px;bottom:80px;}
    .nav-btn{width:48px;height:48px;}
    #flashlightBtn{width:48px;height:48px;}
  }
</style>
</head>
<body data-season="summer">

<div id="app">

  <!-- Боковая панель -->
  <div id="sidebar">
    <div class="sidebar-header">
      <h1>SEASONS PARK</h1>
      <div class="sub">Прогулка по парку</div>
      <div class="mode">🎡 Свободный режим</div>
    </div>

    <div class="cam-section-title">📹 Локации парка</div>
    <div id="camList"></div>

    <a href="index.html" class="back-menu">
      ← <span>В главное меню</span>
    </a>
  </div>

  <!-- Просмотр -->
  <div id="camView">
    <div id="scene"></div>
    <div id="flashlightDarkness"></div>
    <div id="noise"></div>

    <div id="camLabel">
      <div class="cam-num" id="camNum">КАМЕРА 1</div>
      <div class="cam-name" id="camName">КАРУСЕЛЬ</div>
      <div class="cam-season" id="camSeason">☀️ Лето</div>
    </div>

    <div id="camInfo">
      <b>Карусель</b> — центральный аттракцион парка. Когда-то здесь играла музыка, а дети катались до самой ночи.
    </div>

    <div id="controls">
      <div class="nav-buttons">
        <button class="nav-btn" id="prevBtn">←</button>
        <button class="nav-btn" id="nextBtn">→</button>
      </div>
      <button id="flashlightBtn" title="Фонарик (F)">🔦</button>
    </div>
  </div>

</div>

<div id="toast"></div>

<script>
// ============================================================
// cameras.html — Прогулка по парку
// Свободный режим: без аниматроников, без энергии
// ============================================================

const CAMERAS = [
  { id:'carousel',  num:1, name:'Карусель',      emoji:'🎠',
    info:'<b>Карусель</b> — центральный аттракцион парка. Когда-то здесь играла музыка, а дети катались до самой ночи.' },
  { id:'fountain',  num:2, name:'Фонтан',        emoji:'⛲',
    info:'<b>Фонтан</b> — гордость парка. Говорят, если бросить монетку и загадать желание, оно сбудется. Но что-то в этом фонтане не так...' },
  { id:'tree',      num:3, name:'Старое дерево', emoji:'🌳',
    info:'<b>Старое дерево</b> — ему больше 200 лет. Оно помнит времена до парка. Местные говорят, что ночью в ветвях сидит сова.' },
  { id:'slide',     num:4, name:'Ледяная горка', emoji:'🎢',
    info:'<b>Ледяная горка</b> — зимний аттракцион. Здесь всегда холодно, даже летом. Лёд не тает — почему?' },
  { id:'rink',      num:5, name:'Каток',         emoji:'⛸️',
    info:'<b>Каток</b> — зимой здесь катаются на коньках. Летом лёд... остаётся. Никто не знает, почему.' },
  { id:'flowerbed', num:6, name:'Клумба',        emoji:'🌸',
    info:'<b>Клумба</b> — весной здесь цветут розы, лилии и пионы. Аромат чувствуется по всему парку.' },
  { id:'maze',      num:7, name:'Лабиринт',      emoji:'🌿',
    info:'<b>Лабиринт</b> — живые кусты, постриженные в форму стен. Говорят, из него есть только один выход.' },
  { id:'alley',     num:8, name:'Главная аллея', emoji:'🛤️',
    info:'<b>Главная аллея</b> — центральная дорожка парка. Вдоль неё стоят старые фонари, которые иногда мигают сами по себе.' },
  { id:'tunnel',    num:9, name:'Тоннель',       emoji:'🚇',
    info:'<b>Тоннель</b> — подземный проход между частями парка. Здесь темно и сыро. Что-то шевелится в темноте...' },
  { id:'roof',      num:0, name:'Крыша',         emoji:'🏠',
    info:'<b>Крыша павильона</b> — откуда открывается вид на весь парк. Отсюда видно, что парк больше, чем кажется.' },
];

const CONFIG = { HOUR_DURATION: 89, TOTAL_HOURS: 6 };

const SEASONS = {
  summer: { name:'Лето',  emoji:'☀️' },
  autumn: { name:'Осень', emoji:'🍁' },
  winter: { name:'Зима',  emoji:'❄️' },
  spring: { name:'Весна', emoji:'🌸' },
  broken: { name:'Сломанный парк', emoji:'🔥' },
  secret: { name:'Секретная ночь', emoji:'⭐' },
};

// ===== URL =====
const params = new URLSearchParams(location.search);
let gameSeason = params.get('season') || 'summer';
if (!SEASONS[gameSeason]) gameSeason = 'summer';
document.body.dataset.season = gameSeason;

const game = {
  currentCam: 'carousel',
  season: gameSeason,
  flashlight: false,
  flashlightSize: 280,
  flashlightX: 50,
  flashlightY: 50,
};

const $ = id => document.getElementById(id);
const camListEl = $('camList');
const sceneEl = $('scene');
const camNum = $('camNum');
const camName = $('camName');
const camSeason = $('camSeason');
const camInfo = $('camInfo');
const flashlightBtn = $('flashlightBtn');
const toastEl = $('toast');

// ===== Toast =====
function showToast(text, type = ''){
  toastEl.textContent = text;
  toastEl.className = 'show ' + type;
  clearTimeout(toastEl._t);
  toastEl._t = setTimeout(() => { toastEl.className = type; }, 2000);
}

// ===== Список камер =====
function renderCamList(){
  camListEl.innerHTML = '';
  CAMERAS.forEach(cam => {
    const el = document.createElement('div');
    el.className = 'cam-item' + (cam.id === game.currentCam ? ' active' : '');
    el.innerHTML = `
      <span class="num">${cam.num}</span>
      <span class="emoji">${cam.emoji}</span>
      <span class="name">${cam.name}</span>
    `;
    el.onclick = () => switchCamera(cam.id);
    camListEl.appendChild(el);
  });
}

// ===== Переключение =====
function switchCamera(id){
  const cam = CAMERAS.find(c => c.id === id);
  if (!cam) return;
  game.currentCam = id;
  camNum.textContent = `КАМЕРА ${cam.num}`;
  camName.textContent = cam.name.toUpperCase();
  camSeason.textContent = `${SEASONS[game.season].emoji} ${SEASONS[game.season].name}`;
  camInfo.innerHTML = cam.info;
  renderCamList();
  renderScene(cam);
}

// ===== Сцена =====
function renderScene(cam){
  const scene = SCENES[cam.id];
  sceneEl.innerHTML = scene ? scene() : '<div style="color:#64748b;display:flex;align-items:center;justify-content:center;height:100%;font-size:2rem;">📷 Нет сигнала</div>';
  addSceneStars();
}

function addSceneStars(){
  const stars = document.createElement('div');
  stars.className = 'scene-stars';
  for (let i = 0; i < 40; i++){
    const s = document.createElement('div');
    s.className = 'scene-star';
    s.style.left = Math.random() * 100 + '%';
    s.style.top = Math.random() * 60 + '%';
    s.style.animationDelay = Math.random() * 3 + 's';
    if (Math.random() > 0.85){
      s.style.width = '3px';
      s.style.height = '3px';
      s.style.boxShadow = '0 0 6px #fff';
    }
    stars.appendChild(s);
  }
  sceneEl.appendChild(stars);
}

// ===== Сцены =====
const SCENES = {
  carousel: () => {
    let bulbs = '';
    for (let i = 0; i < 12; i++){
      const angle = (i / 12) * Math.PI;
      const x = 50 + Math.cos(angle) * 45;
      const y = 30 + Math.sin(angle) * 30;
      bulbs += `<div class="bulb" style="left:${x}%;top:${y}%;animation-delay:${i*0.1}s;"></div>`;
    }
    return `
      <div class="scene-sky"></div>
      <div class="scene-moon"></div>
      <div class="scene-floor"></div>
      <div class="carousel">
        <div class="pole"></div>
        <div class="wheel">${bulbs}</div>
        <div class="base"></div>
      </div>
    `;
  },
  fountain: () => `
    <div class="scene-sky"></div>
    <div class="scene-moon"></div>
    <div class="scene-floor"></div>
    <div class="fountain">
      <div class="jet"></div>
      <div class="water"></div>
      <div class="basin"></div>
    </div>
  `,
  tree: () => {
    let leaves = '';
    for (let i = 0; i < 8; i++){
      leaves += `<div class="leaf" style="left:${10+i*12}%;animation-delay:${i*0.6}s;">🍂</div>`;
    }
    return `
      <div class="scene-sky"></div>
      <div class="scene-moon"></div>
      <div class="scene-floor"></div>
      <div class="tree">
        <div class="crown"></div>
        <div class="trunk"></div>
        ${leaves}
      </div>
    `;
  },
  slide: () => {
    let flakes = '';
    for (let i = 0; i < 10; i++){
      flakes += `<div class="flake" style="left:${5+i*10}%;animation-delay:${i*0.4}s;">❄</div>`;
    }
    return `
      <div class="scene-sky"></div>
      <div class="scene-moon"></div>
      <div class="scene-floor"></div>
      <div class="slide">
        <div class="ramp"></div>
        <div class="snow"></div>
        ${flakes}
      </div>
    `;
  },
  rink: () => `
    <div class="scene-sky"></div>
    <div class="scene-moon"></div>
    <div class="scene-floor"></div>
    <div class="rink"><div class="ice"></div></div>
  `,
  flowerbed: () => {
    const flowers = ['🌸','🌺','🌷','🌸','🌼','🌺','🌸','🌷','🌸','🌼'];
    return `
      <div class="scene-sky"></div>
      <div class="scene-moon"></div>
      <div class="scene-floor"></div>
      <div class="flowerbed">${flowers.map(f => `<div class="flower">${f}</div>`).join('')}</div>
    `;
  },
  maze: () => `
    <div class="scene-sky"></div>
    <div class="scene-floor"></div>
    <div class="maze">
      <div class="wall" style="top:30%;left:10%;width:30%;height:2px;"></div>
      <div class="wall" style="top:30%;left:10%;width:2px;height:40%;"></div>
      <div class="wall" style="top:50%;right:10%;width:30%;height:2px;"></div>
      <div class="wall" style="top:50%;right:10%;width:2px;height:30%;"></div>
      <div class="wall" style="bottom:20%;left:30%;width:40%;height:2px;"></div>
    </div>
  `,
  alley: () => `
    <div class="scene-sky"></div>
    <div class="scene-moon"></div>
    <div class="alley">
      <div class="path"></div>
      <div class="lamp" style="left:20%;"></div>
      <div class="lamp" style="left:45%;bottom:45%;"></div>
      <div class="lamp" style="left:70%;"></div>
    </div>
  `,
  tunnel: () => `<div class="tunnel"></div>`,
  roof: () => `
    <div class="roof">
      <div class="tiles">
        ${Array.from({length:60}).map(() => '<div class="tile"></div>').join('')}
      </div>
    </div>
  `,
};

// ===== Фонарик =====
function toggleFlashlight(){
  game.flashlight = !game.flashlight;
  flashlightBtn.classList.toggle('on', game.flashlight);
  $('flashlightDarkness').classList.toggle('on', game.flashlight);
  updateFlashlightPos();
}

function updateFlashlightPos(){
  document.documentElement.style.setProperty('--flashlight-size', game.flashlightSize + 'px');
  document.documentElement.style.setProperty('--flashlight-x', game.flashlightX + '%');
  document.documentElement.style.setProperty('--flashlight-y', game.flashlightY + '%');
}

$('camView').addEventListener('mousemove', e => {
  if (!game.flashlight) return;
  const rect = $('camView').getBoundingClientRect();
  game.flashlightX = ((e.clientX - rect.left) / rect.width) * 100;
  game.flashlightY = ((e.clientY - rect.top) / rect.height) * 100;
  updateFlashlightPos();
});

$('camView').addEventListener('touchmove', e => {
  if (!game.flashlight) return;
  const touch = e.touches[0];
  const rect = $('camView').getBoundingClientRect();
  game.flashlightX = ((touch.clientX - rect.left) / rect.width) * 100;
  game.flashlightY = ((touch.clientY - rect.top) / rect.height) * 100;
  updateFlashlightPos();
}, { passive: true });

// ===== Клавиатура =====
document.addEventListener('keydown', e => {
  // F — фонарик
  if (e.code === 'KeyF'){
    e.preventDefault();
    toggleFlashlight();
    return;
  }
  // Esc — в меню
  if (e.key === 'Escape'){
    location.href = 'index.html';
    return;
  }
  // Стрелки — переключение камер
  if (e.code === 'ArrowLeft' || e.code === 'ArrowRight'){
    e.preventDefault();
    const idx = CAMERAS.findIndex(c => c.id === game.currentCam);
    const next = e.code === 'ArrowRight'
      ? (idx + 1) % CAMERAS.length
      : (idx - 1 + CAMERAS.length) % CAMERAS.length;
    switchCamera(CAMERAS[next].id);
    return;
  }
  // Цифры
  const digit = { Digit1:1,Digit2:2,Digit3:3,Digit4:4,Digit5:5,Digit6:6,Digit7:7,Digit8:8,Digit9:9,Digit0:0 };
  if (digit[e.code] !== undefined){
    const cam = CAMERAS.find(c => c.num === digit[e.code]);
    if (cam) switchCamera(cam.id);
  }
});

// ===== Кнопки =====
$('prevBtn').onclick = () => {
  const idx = CAMERAS.findIndex(c => c.id === game.currentCam);
  switchCamera(CAMERAS[(idx - 1 + CAMERAS.length) % CAMERAS.length].id);
};
$('nextBtn').onclick = () => {
  const idx = CAMERAS.findIndex(c => c.id === game.currentCam);
  switchCamera(CAMERAS[(idx + 1) % CAMERAS.length].id);
};
flashlightBtn.onclick = toggleFlashlight;

// ===== Старт =====
renderCamList();
switchCamera('carousel');

console.log('%c🎡 Seasons Park — Прогулка по парку','font-size:18px;color:#38bdf8;font-weight:bold;');
console.log('%cСвободный режим — без игры, без энергии','color:#a78bfa;');
</script>
</body>
</html>
